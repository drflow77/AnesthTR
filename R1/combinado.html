<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0F172A; font-family: 'DM Sans', sans-serif; color: #E2E8F0; min-height: 100vh; }
  
  .screen { display: none; }
  .screen.active { display: block; }
  
  /* START SCREEN */
  .start-screen { display: none; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .start-screen.active { display: flex; }
  .start-box { max-width: 440px; width: 100%; text-align: center; }
  .start-icon { font-size: 48px; margin-bottom: 16px; }
  .start-title { color: #F1F5F9; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
  .start-sub { color: #64748B; font-size: 14px; margin-bottom: 24px; }
  .start-info { background: #1E293B; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left; }
  .start-info-title { font-size: 13px; color: #94A3B8; margin-bottom: 12px; }
  .start-info-title strong { color: #E2E8F0; }
  .start-topics { font-size: 12px; color: #64748B; line-height: 1.6; }
  .topic-dot-va { color: #93C5FD; }
  .topic-dot-cl { color: #FDA4AF; }
  .topic-dot-asa { color: #5EEAD4; }
  .topic-dot-vp { color: #FCD34D; }
  
  .name-input {
    width: 100%; padding: 14px 16px; border-radius: 10px; border: 2px solid #334155;
    background: #1E293B; color: #F1F5F9; font-size: 15px; font-family: inherit;
    outline: none; margin-bottom: 16px; transition: border 0.2s;
  }
  .name-input:focus { border-color: #3B82F6; }
  .name-input::placeholder { color: #475569; }
  
  .btn-start {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: #334155; color: #64748B; font-size: 16px; font-weight: 700;
    cursor: not-allowed; font-family: inherit; transition: all 0.3s;
  }
  .btn-start.ready { background: linear-gradient(135deg, #3B82F6, #8B5CF6); color: #FFF; cursor: pointer; }
  
  /* TOP BAR */
  .top-bar {
    background: #1E293B; padding: 12px 20px; border-bottom: 1px solid #334155;
    position: sticky; top: 0; z-index: 10;
  }
  .top-bar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .top-bar-name { font-size: 13px; color: #94A3B8; }
  .top-bar-count { font-size: 12px; color: #64748B; }
  .progress-track { height: 4px; background: #334155; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3B82F6, #8B5CF6); border-radius: 2px; transition: width 0.3s; }
  
  /* QUESTION NAV */
  .q-nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; justify-content: center; padding: 20px 20px 0; max-width: 600px; margin-left: auto; margin-right: auto; }
  .q-dot {
    width: 28px; height: 28px; border-radius: 6px; border: 1px solid #334155;
    background: #1E293B; color: #475569; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .q-dot.answered { background: #3B82F633; color: #60A5FA; }
  .q-dot.active { border: 2px solid #3B82F6; color: #3B82F6; }
  
  /* QUESTION CARD */
  .q-container { padding: 0 20px 20px; max-width: 600px; margin: 0 auto; }
  .q-card { border-radius: 14px; padding: 20px; margin-bottom: 16px; border: 1px solid; }
  .q-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .q-topic-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
  .q-number { font-size: 13px; font-weight: 700; color: #94A3B8; }
  .q-text { font-size: 15px; color: #F1F5F9; line-height: 1.6; font-weight: 500; }
  
  /* OPTIONS */
  .opt-btn {
    width: 100%; padding: 14px 16px; border-radius: 10px; margin-bottom: 8px;
    border: 1px solid #334155; background: #1E293B; color: #CBD5E1;
    font-size: 14px; text-align: left; cursor: pointer; font-family: inherit;
    line-height: 1.5; transition: all 0.15s; display: flex; align-items: flex-start; gap: 10px;
  }
  .opt-btn.selected { border-width: 2px; }
  .opt-letter {
    min-width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center;
    justify-content: center; background: #334155; color: #94A3B8; font-weight: 700;
    font-size: 13px; flex-shrink: 0;
  }
  .opt-btn.selected .opt-letter { color: #FFF; }
  .opt-text { padding-top: 3px; }
  
  /* NAV BUTTONS */
  .nav-row { display: flex; gap: 8px; margin-top: 20px; }
  .btn-prev, .btn-next, .btn-finish {
    flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-prev { border: 1px solid #334155; background: transparent; color: #94A3B8; }
  .btn-prev:disabled { color: #334155; cursor: default; }
  .btn-next { border: none; background: #3B82F6; color: #FFF; }
  .btn-finish { border: none; background: linear-gradient(135deg, #22C55E, #16A34A); color: #FFF; font-weight: 700; }
  
  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: #00000088; display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #1E293B; border-radius: 16px; padding: 24px; max-width: 360px; width: 100%; text-align: center; }
  .modal-icon { font-size: 36px; margin-bottom: 12px; }
  .modal-title { font-size: 15px; font-weight: 700; color: #F1F5F9; margin-bottom: 8px; }
  .modal-sub { font-size: 13px; color: #94A3B8; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 8px; }
  .btn-modal { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-modal-back { border: 1px solid #334155; background: transparent; color: #94A3B8; }
  .btn-modal-confirm { border: none; background: #EF4444; color: #FFF; }
  
  /* RESULTS */
  .results-header { padding: 32px 20px; text-align: center; }
  .results-name-label { color: #94A3B8; font-size: 13px; margin-bottom: 4px; }
  .results-name { color: #F1F5F9; font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .results-pct { font-size: 56px; font-weight: 800; letter-spacing: -0.04em; }
  .results-score { color: #94A3B8; font-size: 14px; margin-top: 8px; }
  .results-grade { font-size: 14px; font-weight: 700; margin-top: 4px; }
  
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
  .topic-card { border-radius: 10px; padding: 12px; border: 1px solid; }
  .topic-card-name { font-size: 11px; font-weight: 600; margin-bottom: 4px; }
  .topic-card-pct { font-size: 22px; font-weight: 800; }
  .topic-card-count { font-size: 11px; color: #94A3B8; }
  
  .review-title { color: #F1F5F9; font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .review-card { background: #1E293B; border-radius: 12px; padding: 16px; margin-bottom: 10px; border-left: 4px solid; }
  .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .review-topic { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .review-q { font-size: 13px; color: #E2E8F0; margin-bottom: 10px; line-height: 1.5; }
  .review-opt { padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 4px; font-size: 12px; color: #94A3B8; line-height: 1.4; }
  .review-opt.correct { background: #22C55E18; border-color: #22C55E; color: #86EFAC; }
  .review-opt.wrong { background: #EF444418; border-color: #EF4444; color: #FCA5A5; }
  .review-just { margin-top: 8px; padding: 10px; border-radius: 8px; background: #0F172A; font-size: 12px; line-height: 1.5; }
  .review-just.pass { color: #86EFAC; }
  .review-just.fail { color: #FCD34D; }

  .btn-restart {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155;
    background: transparent; color: #94A3B8; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-top: 20px; margin-bottom: 40px;
  }
</style>
</head>

<script>
const QUESTIONS = [
  {q:"La clasificación de Mallampati evalúa la vía aérea con el paciente en posición sentada, boca abierta y sin fonación. ¿Qué estructuras son visibles en un Mallampati Clase II?",opts:["Paladar blando, úvula completa y pilares amigdalinos","Paladar blando, úvula parcial, sin pilares visibles","Solo paladar blando","No se visualiza paladar blando"],ans:1,just:"En Mallampati II se observa paladar blando y úvula parcialmente visible. La clase I muestra úvula completa y pilares; la III solo paladar blando; la IV no permite ver paladar blando.",topic:"Vía aérea"},
  {q:"Un paciente con Mallampati IV indica que no es posible visualizar:",opts:["Los pilares amigdalinos","La úvula","El paladar blando (solo se ve paladar duro)","La epiglotis"],ans:2,just:"Mallampati IV: solo se visualiza el paladar duro. El paladar blando no es visible, lo que predice una intubación potencialmente difícil.",topic:"Vía aérea"},
  {q:"¿Cuál es la principal limitación de la clasificación de Mallampati como predictor único de vía aérea difícil?",opts:["No evalúa la movilidad cervical","Tiene alta sensibilidad pero baja especificidad","Solo aplica a pacientes pediátricos","No se puede realizar en pacientes con barba"],ans:1,just:"Mallampati tiene sensibilidad moderada-alta pero baja especificidad como predictor único, generando muchos falsos positivos. Por eso se combina con otras escalas.",topic:"Vía aérea"},
  {q:"La distancia tiromentoniana (Patil-Aldreti) se mide desde:",opts:["El borde inferior del mentón al cartílago tiroides con cuello en extensión","El borde inferior del mentón al manubrio esternal","La comisura labial al ángulo mandibular","El cartílago tiroides al borde superior del esternón"],ans:0,just:"La distancia tiromentoniana (Patil-Aldreti) se mide del borde inferior del mentón a la escotadura del cartílago tiroides con el cuello en extensión completa.",topic:"Vía aérea"},
  {q:"Una distancia tiromentoniana de Patil-Aldreti Clase III corresponde a:",opts:["Mayor de 6.5 cm — intubación sin dificultad","6.0 a 6.5 cm — laringoscopía difícil posible","Menor de 6.0 cm — intubación difícil","Menor de 4.0 cm — imposible de intubar"],ans:2,just:"Patil-Aldreti: Clase I (>6.5 cm, sin dificultad), Clase II (6.0-6.5 cm, dificultad posible), Clase III (<6.0 cm, intubación difícil predecible).",topic:"Vía aérea"},
  {q:"La clasificación de Bellhouse-Doré evalúa:",opts:["La apertura oral máxima","El grado de extensión de la articulación atlanto-occipital","La protrusión mandibular","La distancia esternomentoniana"],ans:1,just:"Bellhouse-Doré clasifica el grado de extensión de la articulación atlanto-occipital en 4 grados. Una extensión reducida dificulta la alineación de los ejes para la laringoscopía.",topic:"Vía aérea"},
  {q:"Un paciente con Bellhouse-Doré grado IV presenta:",opts:["Extensión completa (35°)","Reducción de 1/3 de la extensión","Reducción de 2/3 de la extensión","Extensión nula de la articulación atlanto-occipital"],ans:3,just:"Bellhouse-Doré: Grado I = extensión completa (~35°), Grado II = reducción de 1/3, Grado III = reducción de 2/3, Grado IV = extensión nula.",topic:"Vía aérea"},
  {q:"La distancia interincisivos normal en un adulto es de aproximadamente:",opts:["Mayor de 3 cm (2-3 dedos)","Mayor de 5 cm (4 dedos)","1.5 a 2 cm (1 dedo)","Mayor de 7 cm"],ans:0,just:"La distancia interincisivos normal es >3 cm (aproximadamente 2-3 dedos del paciente). Una apertura menor a 3 cm sugiere dificultad para la laringoscopía directa.",topic:"Vía aérea"},
  {q:"En la prueba de protrusión mandibular (Upper Lip Bite Test), una Clase III indica que:",opts:["Los incisivos inferiores sobrepasan el labio superior completamente","Los incisivos inferiores tocan el labio superior pero no lo sobrepasan","Los incisivos inferiores no pueden tocar el labio superior","El paciente puede morder completamente el labio inferior"],ans:2,just:"Upper Lip Bite Test: Clase I = incisivos inferiores sobrepasan el labio superior; Clase II = tocan pero no sobrepasan; Clase III = no pueden tocar, predice intubación difícil.",topic:"Vía aérea"},
  {q:"La clasificación de Cormack-Lehane se evalúa durante:",opts:["La valoración pre-anestésica en consultorio","La laringoscopía directa al momento de la intubación","La fibrolaringoscopía nasal preoperatoria","La exploración con el paciente despierto sentado"],ans:1,just:"Cormack-Lehane se clasifica durante la laringoscopía directa, evaluando qué estructuras glóticas son visibles. No es una escala de predicción pre-operatoria sino de hallazgo transoperatorio.",topic:"Cormack-Lehane"},
  {q:"En un Cormack-Lehane Grado IIb se visualiza:",opts:["Toda la glotis","Solo la porción posterior de la glotis (aritenoides)","Solo la epiglotis","Ni epiglotis ni glotis"],ans:1,just:"La subclasificación divide el Grado II en: IIa (comisura posterior parcial) y IIb (solo aritenoides visibles). El IIb tiene mayor asociación con intubación difícil.",topic:"Cormack-Lehane"},
  {q:"Un Cormack-Lehane Grado III significa que durante la laringoscopía directa solo se visualiza:",opts:["La glotis completa","La porción posterior de las cuerdas vocales","Solo la epiglotis, sin visualizar cuerdas vocales","Ninguna estructura laríngea"],ans:2,just:"Grado I = glotis completa; Grado II = glotis parcial; Grado III = solo epiglotis; Grado IV = no se ve epiglotis ni glotis. El grado III requiere maniobras adicionales (BURP, bougie).",topic:"Cormack-Lehane"},
  {q:"Caso clínico: Paciente femenina de 45 años, durante laringoscopía directa con hoja Macintosh #3 no se logra visualizar epiglotis ni cuerdas vocales. ¿Qué grado de Cormack-Lehane presenta?",opts:["Grado II","Grado IIb","Grado III","Grado IV"],ans:3,just:"Al no visualizar ni epiglotis ni cuerdas vocales corresponde a un Cormack-Lehane Grado IV, la situación más difícil para intubación orotraqueal por laringoscopía directa.",topic:"Cormack-Lehane"},
  {q:"Un paciente sano, sin comorbilidades, no fumador, IMC normal, que acude para cirugía electiva se clasifica como:",opts:["ASA I","ASA II","ASA IE","ASA IIE"],ans:0,just:"ASA I: paciente sano, sin enfermedad orgánica, sin alteración funcional. No fuma, no bebe alcohol en exceso, IMC <30.",topic:"ASA"},
  {q:"Caso clínico: Paciente masculino de 50 años con diabetes mellitus tipo 2 controlada con metformina, HbA1c de 6.8%, sin complicaciones microvasculares. Se clasifica como:",opts:["ASA I","ASA II","ASA III","ASA IV"],ans:1,just:"ASA II: enfermedad sistémica leve, bien controlada. DM2 controlada (HbA1c <7%) sin complicaciones corresponde a ASA II.",topic:"ASA"},
  {q:"¿Cuál de los siguientes pacientes corresponde a ASA III?",opts:["Fumador social sin otra patología","Paciente con EPOC severo con uso de oxígeno domiciliario","Diabético con insuficiencia renal crónica en hemodiálisis","Paciente con infarto agudo al miocardio hace 1 hora"],ans:2,just:"ASA III: enfermedad sistémica grave con limitación funcional. DM con IRC en hemodiálisis tiene enfermedad significativa.",topic:"ASA"},
  {q:"Caso clínico: Paciente femenina de 58 años, IMC 33, con antecedente de trombosis venosa profunda hace 2 años, programada para histerectomía total abdominal bajo anestesia general con duración estimada de 90 minutos. ¿Cuál es la clasificación ASA y el riesgo tromboembólico por Caprini más probable?",opts:["ASA I, Caprini bajo riesgo","ASA II, Caprini riesgo moderado","ASA II, Caprini riesgo alto","ASA III, Caprini riesgo alto"],ans:2,just:"ASA II: obesidad (IMC 33) es enfermedad sistémica leve sin limitación funcional. Caprini riesgo alto: antecedente de TVP (+5 pts), cirugía mayor >45 min (+2), obesidad IMC >25 (+1), edad 41-60 (+1) = 9+ puntos = riesgo alto, requiere tromboprofilaxis farmacológica.",topic:"ASA"},
  {q:"Un paciente ASA V se define como:",opts:["Paciente con enfermedad sistémica grave incapacitante","Paciente moribundo que no se espera que sobreviva sin cirugía","Paciente con muerte cerebral para donación de órganos","Paciente terminal con cáncer metastásico"],ans:1,just:"ASA V: paciente moribundo que no se espera sobreviva 24 horas con o sin cirugía. ASA VI es muerte cerebral/donador de órganos.",topic:"ASA"},
  {q:"Caso clínico: Mujer de 35 años, IMC 32, fumadora ocasional, sin otros antecedentes. Se programa para colecistectomía electiva. ¿Qué ASA le corresponde?",opts:["ASA I","ASA II","ASA III","ASA IIE"],ans:1,just:"ASA II: obesidad (IMC 30-39.9) y tabaquismo son ejemplos clásicos de ASA II — enfermedad leve sin limitación funcional significativa. No es emergencia, no lleva 'E'.",topic:"ASA"},
  {q:"¿Cuál es el objetivo principal de la valoración pre-anestésica?",opts:["Decidir si el paciente requiere cirugía","Identificar factores de riesgo, optimizar condiciones y planificar el manejo anestésico","Realizar todos los estudios de laboratorio posibles","Obtener la firma del consentimiento informado únicamente"],ans:1,just:"La valoración pre-anestésica busca identificar factores de riesgo, optimizar condiciones médicas y planificar la técnica anestésica más segura.",topic:"Valoración pre-anestésica"},
  {q:"En la valoración pre-anestésica, ¿cuál de los siguientes estudios es INDISPENSABLE solicitar a TODOS los pacientes ASA I para cirugía electiva de bajo riesgo?",opts:["Biometría hemática, tiempos de coagulación y radiografía de tórax","Electrocardiograma y pruebas de función hepática","No existen estudios obligatorios universales; se solicitan según la historia clínica y el tipo de cirugía","Gasometría arterial y espirometría"],ans:2,just:"Las guías actuales no recomiendan estudios de rutina universales en pacientes sanos para cirugías de bajo riesgo. Se individualizan según antecedentes y procedimiento.",topic:"Valoración pre-anestésica"},
  {q:"Caso clínico: Paciente de 68 años con hipertensión en tratamiento con enalapril. En su valoración pre-anestésica para prótesis de rodilla, ¿qué conducta es la más apropiada respecto al enalapril?",opts:["Suspenderlo 1 semana antes de la cirugía","Suspenderlo la mañana de la cirugía","Nunca suspenderlo, dar dosis habitual con sorbo de agua","Cambiarlo por un betabloqueador"],ans:1,just:"Los IECA (enalapril) se recomienda suspenderlos la mañana de la cirugía por riesgo de hipotensión refractaria bajo anestesia general.",topic:"Valoración pre-anestésica"},
  {q:"El ayuno pre-anestésico recomendado para líquidos claros en adultos según las guías ASA es de:",opts:["2 horas","4 horas","6 horas","8 horas"],ans:0,just:"Guías ASA de ayuno: líquidos claros = 2 horas, leche materna = 4 horas, alimentos ligeros = 6 horas, alimentos pesados/grasosos = 8 horas.",topic:"Valoración pre-anestésica"},
  {q:"Caso clínico: Paciente masculino de 55 años, ASA II, programado para hernioplastía inguinal. Toma ácido acetilsalicílico 100 mg diarios por prevención cardiovascular primaria. ¿Qué se recomienda?",opts:["Suspender aspirina 7-10 días antes","Continuar aspirina, no incrementa riesgo significativo en esta cirugía","Cambiar a clopidogrel 3 días antes","Suspender 24 horas antes es suficiente"],ans:0,just:"En prevención primaria (sin stents ni evento cardiovascular reciente), se recomienda suspender aspirina 7-10 días antes de cirugía electiva para reducir riesgo de sangrado.",topic:"Valoración pre-anestésica"},
  {q:"¿Cuál de las siguientes escalas se utiliza para evaluar el riesgo de broncoaspiración?",opts:["Escala de Caprini","Escala de Mallampati","Índice de riesgo de aspiración (criterios de paciente con estómago lleno)","Escala de Glasgow"],ans:2,just:"El riesgo de broncoaspiración se evalúa identificando factores de estómago lleno: ayuno inadecuado, embarazo, obesidad, hernia hiatal, gastroparesia, trauma, etc.",topic:"Valoración pre-anestésica"}
];

const topicStyles = {
  "Vía aérea": {bg:"#1E3A5F",border:"#3B82F6",text:"#93C5FD"},
  "Cormack-Lehane": {bg:"#3B1F2B",border:"#E11D48",text:"#FDA4AF"},
  "ASA": {bg:"#1A3636",border:"#14B8A6",text:"#5EEAD4"},
  "Valoración pre-anestésica": {bg:"#3D2F0A",border:"#F59E0B",text:"#FCD34D"}
};

let userName = "";
let currentQ = 0;
let answers = {};

// START
const nameInput = document.getElementById("nameInput");
const btnStart = document.getElementById("btnStart");

nameInput.addEventListener("input", () => {
  const ready = nameInput.value.trim().length > 0;
  btnStart.disabled = !ready;
  btnStart.classList.toggle("ready", ready);
});

btnStart.addEventListener("click", () => {
  userName = nameInput.value.trim();
  if (!userName) return;
  document.getElementById("startScreen").classList.remove("active");
  document.getElementById("examScreen").classList.add("active");
  document.getElementById("topName").textContent = userName;
  buildNav();
  renderQuestion();
});

function buildNav() {
  const nav = document.getElementById("qNav");
  nav.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.className = "q-dot";
    btn.textContent = i + 1;
    btn.onclick = () => { currentQ = i; renderQuestion(); };
    nav.appendChild(btn);
  });
}

function updateNav() {
  const dots = document.querySelectorAll(".q-dot");
  dots.forEach((d, i) => {
    d.className = "q-dot";
    if (answers[i] !== undefined) d.classList.add("answered");
    if (i === currentQ) d.classList.add("active");
  });
  const cnt = Object.keys(answers).length;
  document.getElementById("topCount").textContent = cnt + "/25 contestadas";
  document.getElementById("progressFill").style.width = (cnt / 25 * 100) + "%";
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const ts = topicStyles[q.topic];
  const container = document.getElementById("qContainer");
  
  let html = `<div class="q-card" style="background:${ts.bg};border-color:${ts.border}44">
    <div class="q-card-header">
      <span class="q-topic-badge" style="color:${ts.text};background:${ts.border}22">${q.topic}</span>
      <span class="q-number">${currentQ+1} / ${QUESTIONS.length}</span>
    </div>
    <div class="q-text">${q.q}</div>
  </div>`;
  
  q.opts.forEach((opt, oi) => {
    const sel = answers[currentQ] === oi;
    const borderC = sel ? ts.border : "#334155";
    const bgC = sel ? ts.border + "22" : "#1E293B";
    const txtC = sel ? ts.text : "#CBD5E1";
    const letterBg = sel ? ts.border : "#334155";
    const letterC = sel ? "#FFF" : "#94A3B8";
    html += `<button class="opt-btn${sel?" selected":""}" onclick="selectOpt(${oi})" style="border-color:${borderC};background:${bgC};color:${txtC}">
      <span class="opt-letter" style="background:${letterBg};color:${letterC}">${String.fromCharCode(65+oi)}</span>
      <span class="opt-text">${opt}</span>
    </button>`;
  });
  
  html += `<div class="nav-row">
    <button class="btn-prev" onclick="prevQ()"${currentQ===0?" disabled":""}>&larr; Anterior</button>`;
  if (currentQ < QUESTIONS.length - 1) {
    html += `<button class="btn-next" onclick="nextQ()">Siguiente &rarr;</button>`;
  } else {
    html += `<button class="btn-finish" onclick="tryFinish()">Terminar examen</button>`;
  }
  html += `</div>`;
  
  container.innerHTML = html;
  updateNav();
  window.scrollTo({top: 0, behavior: "smooth"});
}

function selectOpt(oi) {
  answers[currentQ] = oi;
  renderQuestion();
}

function prevQ() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function nextQ() { if (currentQ < QUESTIONS.length-1) { currentQ++; renderQuestion(); } }

function tryFinish() {
  const unanswered = QUESTIONS.length - Object.keys(answers).length;
  if (unanswered > 0) {
    document.getElementById("modalTitle").textContent = `Tienes ${unanswered} pregunta${unanswered>1?"s":""} sin contestar`;
    document.getElementById("confirmModal").classList.add("show");
  } else {
    finishExam();
  }
}

function closeModal() { document.getElementById("confirmModal").classList.remove("show"); }

function finishExam() {
  closeModal();
  document.getElementById("examScreen").classList.remove("active");
  document.getElementById("resultsScreen").classList.add("active");
  renderResults();
}

function renderResults() {
  let correct = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.ans) correct++; });
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  const gc = pct >= 80 ? "#22C55E" : pct >= 60 ? "#F59E0B" : "#EF4444";
  const grade = pct >= 80 ? "¡Excelente!" : pct >= 60 ? "Aprobado — sigue estudiando" : "Reprobado — a repasar";
  
  const topicStats = {};
  QUESTIONS.forEach((q, i) => {
    if (!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total++;
    if (answers[i] === q.ans) topicStats[q.topic].correct++;
  });
  
  let html = `<div class="results-header" style="background:linear-gradient(135deg,#1E293B,#0F172A);border-bottom:3px solid ${gc}">
    <div class="results-name-label">Resultado de</div>
    <div class="results-name">${userName}</div>
    <div class="results-pct" style="color:${gc}">${pct}%</div>
    <div class="results-score">${correct} de ${QUESTIONS.length} correctas</div>
    <div class="results-grade" style="color:${gc}">${grade}</div>
  </div>`;
  
  html += `<div style="padding:16px 20px;max-width:600px;margin:0 auto">`;
  html += `<div class="topic-grid">`;
  for (const [topic, st] of Object.entries(topicStats)) {
    const ts = topicStyles[topic];
    const tp = Math.round((st.correct/st.total)*100);
    html += `<div class="topic-card" style="background:${ts.bg};border-color:${ts.border}33">
      <div class="topic-card-name" style="color:${ts.text}">${topic}</div>
      <div class="topic-card-pct" style="color:${ts.text}">${tp}%</div>
      <div class="topic-card-count">${st.correct}/${st.total}</div>
    </div>`;
  }
  html += `</div>`;
  
  html += `<div class="review-title">Revisión de respuestas</div>`;
  QUESTIONS.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.ans;
    const ts = topicStyles[q.topic];
    const borderC = isCorrect ? "#22C55E" : "#EF4444";
    
    html += `<div class="review-card" style="border-left-color:${borderC}">
      <div class="review-header">
        <span class="review-topic" style="color:${ts.text};background:${ts.border}22">${q.topic}</span>
        <span style="font-size:20px">${isCorrect?"✅":"❌"}</span>
      </div>
      <div class="review-q"><strong>${i+1}.</strong> ${q.q}</div>`;
    
    q.opts.forEach((opt, oi) => {
      let cls = "review-opt";
      let extra = "";
      if (oi === q.ans) { cls += " correct"; extra = " ✓"; }
      else if (oi === userAns && oi !== q.ans) { cls += " wrong"; extra = " ← tu respuesta"; }
      html += `<div class="${cls}"><strong>${String.fromCharCode(65+oi)})</strong> ${opt}${extra}</div>`;
    });
    
    const justCls = isCorrect ? "pass" : "fail";
    const justIcon = isCorrect ? "✓" : "💡";
    html += `<div class="review-just ${justCls}">${justIcon} ${q.just}</div></div>`;
  });
  
  html += `<button class="btn-restart" onclick="restart()">🔄 Volver a intentar</button>`;
  html += `</div>`;
  
  document.getElementById("resultsScreen").innerHTML = html;
  window.scrollTo({top: 0, behavior: "smooth"});
}

function restart() {
  answers = {};
  currentQ = 0;
  userName = "";
  nameInput.value = "";
  btnStart.disabled = true;
  btnStart.classList.remove("ready");
  document.getElementById("resultsScreen").classList.remove("active");
  document.getElementById("resultsScreen").innerHTML = "";
  document.getElementById("startScreen").classList.add("active");
}
</script>
</body>
</html>
