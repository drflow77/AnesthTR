<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crucigrama de Opioides — AnesthTR</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--surface3:#212d45;
  --border:#2a3a5c;
  --ink:#e8ecf4;--ink-soft:#8896b3;--ink-muted:#5a6a8a;
  --fire:#ff6b35;--fire-soft:rgba(255,107,53,0.12);
  --gold:#fbbf24;
  --green:#34d399;--green-soft:rgba(52,211,153,0.12);
  --red:#f87171;--red-soft:rgba(248,113,113,0.12);
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --nav-h:60px;--radius:12px;
  --cell:36px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* NAV */
.topnav{height:var(--nav-h);position:fixed;top:0;left:0;right:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;}
.logo-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--fire),var(--gold));color:#0a0e1a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.logo-name{font-size:17px;font-weight:800;letter-spacing:-0.3px;color:var(--ink);}
.nav-divider{width:1px;height:24px;background:var(--border);}
.nav-topic{font-size:13px;font-weight:600;color:var(--ink-soft);}

main{padding-top:var(--nav-h);}
.container{max-width:1100px;margin:0 auto;padding:24px 20px 48px;}

/* HEADER */
.page-header{margin-bottom:18px;}
.eyebrow-badge{display:inline-flex;align-items:center;background:var(--fire-soft);color:var(--fire);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.4px;border:1px solid rgba(255,107,53,0.3);margin-bottom:8px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--ink) 0%,var(--fire) 60%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:4px 12px;font-size:12px;color:var(--ink-soft);}
.pill span{font-weight:700;color:var(--ink);}
.btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);transition:all 0.15s;}
.btn:hover{background:var(--surface2);color:var(--ink);}
.btn.primary{border-color:rgba(255,107,53,0.5);color:var(--fire);background:var(--fire-soft);}
.btn.primary:hover{background:rgba(255,107,53,0.2);}

/* MSG */
.msg{font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;margin-bottom:12px;display:none;}
.msg.show{display:block;}
.msg.good{background:var(--green-soft);border:1px solid rgba(52,211,153,0.35);color:var(--green);}
.msg.bad{background:var(--red-soft);border:1px solid rgba(248,113,113,0.35);color:var(--red);}
.msg.info{background:var(--surface2);border:1px solid var(--border);color:var(--ink-soft);}

/* MAIN LAYOUT — grid left, clues right */
.main-layout{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:20px;
  align-items:start;
}

/* GRID */
.grid-section{min-width:0;}
.grid-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.grid{display:inline-grid;gap:3px;background:var(--border);padding:3px;border-radius:10px;}
.cell{width:var(--cell);height:var(--cell);position:relative;background:var(--surface);border-radius:3px;}
.cell.blk{background:var(--surface3);opacity:0.55;pointer-events:none;}
.cell.hi-h{background:rgba(255,107,53,0.08);}
.cell.hi-v{background:rgba(34,211,238,0.07);}
.cell.active-h{background:#2a1f12;outline:2px solid var(--fire);outline-offset:-1px;}
.cell.active-v{background:#0e2a30;outline:2px solid #22d3ee;outline-offset:-1px;}
.cell.ok{background:rgba(52,211,153,0.15);}
.cell.err{background:rgba(248,113,113,0.12);}
.cell input{
  width:100%;height:100%;border:none;background:transparent;
  text-align:center;font-size:13px;font-weight:700;text-transform:uppercase;
  color:var(--ink);outline:none;caret-color:transparent;cursor:pointer;
  padding:0;font-family:var(--mono);
  /* prevent zoom on tap in iOS */
  font-size:max(13px, 16px);
}
.cell.ok input{color:var(--green);}
.cell.err input{color:var(--red);}
.cnum{position:absolute;top:1px;left:2px;font-size:7px;font-weight:700;color:var(--ink-muted);line-height:1;pointer-events:none;font-family:var(--mono);}

/* CLUES PANEL */
.clues-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  position:sticky;
  top:calc(var(--nav-h) + 12px);
  max-height:calc(100vh - var(--nav-h) - 24px);
  overflow-y:auto;
  /* custom scrollbar */
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.clues-section::-webkit-scrollbar{width:4px;}
.clues-section::-webkit-scrollbar-track{background:transparent;}
.clues-section::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.clues{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* Horizontal = orange, Vertical = teal */
.cgroup.horiz .cgroup-title{font-size:10.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid rgba(255,107,53,0.5);color:var(--fire);}
.cgroup.vert  .cgroup-title{font-size:10.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid rgba(34,211,238,0.5);color:#22d3ee;}

.ci{display:flex;gap:6px;padding:6px 7px;border-radius:6px;cursor:pointer;align-items:flex-start;margin-bottom:2px;transition:background 0.1s;}
.ci:hover{background:var(--surface2);}
.ci .ct{font-size:12px;color:var(--ink-soft);line-height:1.45;}

/* Number badges per direction */
.cgroup.horiz .ci .cn{font-family:var(--mono);font-size:10px;font-weight:700;min-width:16px;padding-top:1px;flex-shrink:0;color:rgba(255,107,53,0.7);}
.cgroup.vert  .ci .cn{font-family:var(--mono);font-size:10px;font-weight:700;min-width:16px;padding-top:1px;flex-shrink:0;color:rgba(34,211,238,0.7);}

/* Selected state per direction */
.cgroup.horiz .ci.sel{background:var(--fire-soft);border:1px solid rgba(255,107,53,0.3);}
.cgroup.horiz .ci.sel .ct{color:var(--fire);font-weight:600;}
.cgroup.horiz .ci.sel .cn{color:var(--fire);}
.cgroup.vert  .ci.sel{background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.3);}
.cgroup.vert  .ci.sel .ct{color:#22d3ee;font-weight:600;}
.cgroup.vert  .ci.sel .cn{color:#22d3ee;}

/* Active clue bar matches direction */
.selected-clue-label.dir-h{color:var(--fire);background:var(--fire-soft);border-color:rgba(255,107,53,0.3);}
.selected-clue-label.dir-v{color:#22d3ee;background:rgba(34,211,238,0.08);border-color:rgba(34,211,238,0.3);}

/* Clue selected highlight in grid area */
.selected-clue-label{
  display:none;font-size:12px;color:var(--fire);font-weight:600;
  margin-top:10px;padding:8px 10px;background:var(--fire-soft);
  border:1px solid rgba(255,107,53,0.3);border-radius:6px;line-height:1.45;
}
.selected-clue-label.show{display:block;}

/* FOOTER */
.page-footer{text-align:center;padding:20px;font-size:11px;color:var(--ink-muted);border-top:1px solid var(--border);margin-top:12px;}

/* ── RESPONSIVE ── */
/* Tablet: clues panel moves below, 2 cols */
@media(max-width:860px){
  .main-layout{grid-template-columns:1fr;}
  .clues-section{position:static;max-height:none;}
  .clues{grid-template-columns:1fr 1fr;}
}
/* Mobile: 1 col clues, smaller cells */
@media(max-width:520px){
  :root{--cell:28px;}
  .container{padding:16px 12px 40px;}
  .topnav{padding:0 14px;}
  .page-title{font-size:20px;}
  .clues{grid-template-columns:1fr;}
  .cell input{font-size:max(11px,16px);}
  .cnum{font-size:6px;}
}
</style>
</head>
<body>

<nav class="topnav">
  <a class="nav-logo" href="/opioides">
    <div class="logo-mark">A</div>
    <span class="logo-name">AnesthTR</span>
  </a>
  <div class="nav-divider"></div>
  <span class="nav-topic">Farmacología · Opioides</span>
</nav>

<main>
<div class="container">

  <div class="page-header">
    <div class="eyebrow-badge">CRUCIGRAMA</div>
    <h1 class="page-title">Opioides en anestesia</h1>
    <p class="page-sub">Nivel intermedio · fármacos, receptores, mecanismos y efectos adversos</p>
  </div>

  <div class="toolbar">
    <div class="pill">Correctas: <span id="sc">0</span>/<span id="tot">0</span></div>
    <button class="btn primary" onclick="check()">Verificar</button>
    <button class="btn" onclick="reveal()">Revelar todo</button>
    <button class="btn" onclick="reset()">Reiniciar</button>
  </div>

  <div id="msgbox" class="msg"></div>

  <div class="main-layout">
    <!-- LEFT: Grid -->
    <div class="grid-section">
      <div class="grid-wrap"><div class="grid" id="g"></div></div>
      <!-- Shows selected clue on mobile below grid -->
      <div class="selected-clue-label" id="activeClue"></div>
    </div>

    <!-- RIGHT: Clues panel -->
    <div class="clues-section">
      <div class="clues">
        <div class="cgroup horiz"><div class="cgroup-title">→ Horizontal</div><div id="clH"></div></div>
        <div class="cgroup vert"><div class="cgroup-title">↓ Vertical</div><div id="clV"></div></div>
      </div>
    </div>
  </div>

</div>
<div class="page-footer">AnesthTR · Solo fines educativos · Farmacología de Opioides 2026</div>
</main>

<script>
const DATA = [
  {n:1,  word:"FENTANILO",     dir:"H", r:0,  c:0,  clue:"Opioide sintético 100× más potente que morfina, muy lipofílico"},
  {n:2,  word:"MORFINA",       dir:"V", r:0,  c:6,  clue:"Opioide prototipo; metabolito activo: morfina-6-glucurónido"},
  {n:3,  word:"NALOXONA",      dir:"H", r:2,  c:0,  clue:"Antagonista puro, revierte depresión respiratoria por opioides"},
  {n:4,  word:"REMIFENTANILO", dir:"H", r:4,  c:0,  clue:"Éster degradado por esterasas inespecíficas; contexto-sensitivo muy corto"},
  {n:5,  word:"KAPPA",         dir:"V", r:4,  c:5,  clue:"Receptor opioide que produce disforia y sedación espinal"},
  {n:6,  word:"MIOSIS",        dir:"H", r:6,  c:2,  clue:"Signo pupilar clásico de intoxicación por opioides"},
  {n:7,  word:"TRAMADOL",      dir:"V", r:4,  c:11, clue:"Opioide débil + inhibidor de recaptura de serotonina/norepinefrina"},
  {n:8,  word:"DELTA",         dir:"H", r:8,  c:0,  clue:"Receptor opioide modulador de humor y analgesia supraespinal"},
  {n:9,  word:"METADONA",      dir:"V", r:6,  c:3,  clue:"Opioide de acción prolongada + antagonista NMDA; útil en dolor crónico"},
  {n:10, word:"MU",            dir:"H", r:10, c:0,  clue:"Receptor opioide principal; media analgesia, euforia y dependencia"},
  {n:11, word:"SUFENTANILO",   dir:"H", r:12, c:0,  clue:"El más potente para uso clínico; 500-1000× morfina"},
  {n:12, word:"PRURITO",       dir:"V", r:10, c:8,  clue:"Efecto adverso común con morfina espinal; mediado por receptor mu"},
  {n:13, word:"NAUSEA",        dir:"H", r:14, c:1,  clue:"Efecto adverso emético por acción en zona gatillo quimiorreceptora"},
  {n:14, word:"BUPRENORFINA",  dir:"H", r:16, c:0,  clue:"Agonista parcial mu y antagonista kappa; efecto techo en depresión respiratoria"},
];

const ROWS=18, COLS=13;
let grid=[], sel=null, selDir="H", selWord=null;

function buildGrid(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(!grid[r][c]) grid[r][c]={letter:d.word[i],val:"",num:null};
      else grid[r][c].letter=d.word[i];
    }
    grid[d.r][d.c].num=d.n;
  });
}

function renderGrid(){
  const g=document.getElementById("g");
  g.style.gridTemplateColumns=`repeat(${COLS},var(--cell))`;
  g.style.gridTemplateRows=`repeat(${ROWS},var(--cell))`;
  g.innerHTML="";
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cd=document.createElement("div");
      cd.className="cell"; cd.dataset.r=r; cd.dataset.c=c;
      if(!grid[r][c]){cd.classList.add("blk"); g.appendChild(cd); continue;}
      const cell=grid[r][c];
      if(isHighlighted(r,c)) cd.classList.add(selDir==="H"?"hi-h":"hi-v");
      if(sel&&sel[0]===r&&sel[1]===c) cd.classList.add(selDir==="H"?"active-h":"active-v");
      if(cell.checked===true) cd.classList.add("ok");
      else if(cell.checked===false) cd.classList.add("err");
      if(cell.num){const sp=document.createElement("span");sp.className="cnum";sp.textContent=cell.num;cd.appendChild(sp);}
      const inp=document.createElement("input");
      inp.maxLength=1; inp.value=cell.val||"";
      inp.setAttribute("autocomplete","off");
      inp.setAttribute("autocorrect","off");
      inp.setAttribute("autocapitalize","characters");
      inp.setAttribute("spellcheck","false");
      inp.setAttribute("inputmode","text");
      inp.addEventListener("click",()=>handleClick(r,c,inp));
      inp.addEventListener("keydown",(e)=>handleKey(e,r,c));
      inp.addEventListener("input",(e)=>handleInput(e,r,c,inp));
      cd.appendChild(inp);
      g.appendChild(cd);
    }
  }
  updateScore();
}

function isHighlighted(r,c){
  if(!selWord) return false;
  const w=DATA.find(d=>d.n===selWord);
  if(!w) return false;
  for(let i=0;i<w.word.length;i++){
    const wr=w.dir==="H"?w.r:w.r+i, wc=w.dir==="H"?w.c+i:w.c;
    if(wr===r&&wc===c) return true;
  }
  return false;
}

function handleClick(r,c,inp){
  if(sel&&sel[0]===r&&sel[1]===c){
    selDir=selDir==="H"?"V":"H";
    const w=findWord(r,c,selDir)||findWord(r,c,selDir==="H"?"V":"H");
    selWord=w?w.n:null; if(w) selDir=w.dir;
  } else {
    sel=[r,c];
    const wH=findWord(r,c,"H"), wV=findWord(r,c,"V");
    const w=wH||wV; selDir=w?w.dir:"H"; selWord=w?w.n:null;
  }
  renderGrid(); inp.focus();
  if(selWord) highlightClue(selWord);
  showActiveClue();
}

function findWord(r,c,dir){
  return DATA.find(d=>{
    if(d.dir!==dir) return false;
    for(let i=0;i<d.word.length;i++){
      const wr=d.dir==="H"?d.r:d.r+i, wc=d.dir==="H"?d.c+i:d.c;
      if(wr===r&&wc===c) return true;
    }
    return false;
  });
}

/* Handle mobile virtual keyboard input */
function handleInput(e,r,c,inp){
  const raw=inp.value.replace(/[^a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/g,'');
  if(!raw){grid[r][c].val=""; grid[r][c].checked=undefined; renderGrid(); refocus(r,c); return;}
  const ch=raw[raw.length-1].toUpperCase();
  grid[r][c].val=ch; grid[r][c].checked=undefined;
  inp.value=ch;
  moveNext(r,c);
  renderGrid();
}

function handleKey(e,r,c){
  const cell=grid[r][c]; if(!cell) return;
  if(e.key==="Backspace"){
    e.preventDefault();
    if(cell.val){cell.val=""; cell.checked=undefined;}
    else moveBack(r,c);
    renderGrid(); refocus(r,c); return;
  }
  if(e.key.length===1&&e.key.match(/[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/)){
    e.preventDefault();
    cell.val=e.key.toUpperCase(); cell.checked=undefined;
    moveNext(r,c); renderGrid(); return;
  }
  if(e.key==="ArrowRight"){e.preventDefault();const nc=c+1<COLS&&grid[r][c+1]?c+1:c;sel=[r,nc];selDir="H";renderGrid();refocus(r,nc);}
  if(e.key==="ArrowLeft"){e.preventDefault();const nc=c-1>=0&&grid[r][c-1]?c-1:c;sel=[r,nc];selDir="H";renderGrid();refocus(r,nc);}
  if(e.key==="ArrowDown"){e.preventDefault();const nr=r+1<ROWS&&grid[r+1]&&grid[r+1][c]?r+1:r;sel=[nr,c];selDir="V";renderGrid();refocus(nr,c);}
  if(e.key==="ArrowUp"){e.preventDefault();const nr=r-1>=0&&grid[r-1]&&grid[r-1][c]?r-1:r;sel=[nr,c];selDir="V";renderGrid();refocus(nr,c);}
}

function moveNext(r,c){
  if(!selWord){sel=[r,c];return;}
  const w=DATA.find(d=>d.n===selWord); if(!w) return;
  for(let i=0;i<w.word.length-1;i++){
    const wr=w.dir==="H"?w.r:w.r+i, wc=w.dir==="H"?w.c+i:w.c;
    if(wr===r&&wc===c){
      const nr=w.dir==="H"?w.r:w.r+i+1, nc=w.dir==="H"?w.c+i+1:w.c;
      sel=[nr,nc]; setTimeout(()=>refocus(nr,nc),10); return;
    }
  }
}

function moveBack(r,c){
  if(!selWord){sel=[r,c];return;}
  const w=DATA.find(d=>d.n===selWord); if(!w) return;
  for(let i=1;i<w.word.length;i++){
    const wr=w.dir==="H"?w.r:w.r+i, wc=w.dir==="H"?w.c+i:w.c;
    if(wr===r&&wc===c){
      const pr=w.dir==="H"?w.r:w.r+i-1, pc=w.dir==="H"?w.c+i-1:w.c;
      sel=[pr,pc]; setTimeout(()=>refocus(pr,pc),10); return;
    }
  }
}

function refocus(r,c){
  document.querySelectorAll(".cell").forEach(cd=>{
    if(parseInt(cd.dataset.r)===r&&parseInt(cd.dataset.c)===c){
      const inp=cd.querySelector("input"); if(inp) inp.focus();
    }
  });
}

function renderClues(){
  const hDiv=document.getElementById("clH"), vDiv=document.getElementById("clV");
  DATA.filter(d=>d.dir==="H").sort((a,b)=>a.n-b.n).forEach(d=>hDiv.appendChild(clueEl(d)));
  DATA.filter(d=>d.dir==="V").sort((a,b)=>a.n-b.n).forEach(d=>vDiv.appendChild(clueEl(d)));
}

function clueEl(d){
  const div=document.createElement("div");
  div.className="ci"; div.id="clue-"+d.n;
  div.innerHTML=`<span class="cn">${d.n}</span><span class="ct">${d.clue}</span>`;
  div.onclick=()=>{
    selWord=d.n; selDir=d.dir; sel=[d.r,d.c];
    renderGrid(); highlightClue(d.n);
    showActiveClue();
    setTimeout(()=>refocus(d.r,d.c),20);
  };
  return div;
}

function highlightClue(n){
  document.querySelectorAll(".ci").forEach(el=>el.classList.remove("sel"));
  const el=document.getElementById("clue-"+n);
  if(el){el.classList.add("sel"); el.scrollIntoView({block:"nearest",behavior:"smooth"});}
}

/* Show active clue text below grid (useful on mobile) */
function showActiveClue(){
  const lbl=document.getElementById("activeClue");
  if(!selWord){lbl.className="selected-clue-label"; return;}
  const w=DATA.find(d=>d.n===selWord);
  if(!w){lbl.className="selected-clue-label"; return;}
  lbl.textContent=`${w.n}. ${w.dir==="H"?"→":"↓"} ${w.clue}`;
  lbl.className=`selected-clue-label show ${w.dir==="H"?"dir-h":"dir-v"}`;
}

function check(){
  let correct=0, total=0;
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      const cell=grid[r][c]; if(!cell) continue; total++;
      if(cell.val===d.word[i]){cell.checked=true; correct++;}
      else if(cell.val) cell.checked=false;
      else cell.checked=undefined;
    }
  });
  showMsg(
    correct===total&&total>0?`¡Perfecto! Todas las ${total} letras correctas.`:
    correct===0?`Ninguna letra correcta aún. ¡Sigue intentando!`:
    `${correct} de ${total} letras correctas.`,
    correct===total&&total>0?"good":correct<total/2?"bad":"info"
  );
  renderGrid();
}

function reveal(){
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(grid[r][c]){grid[r][c].val=d.word[i]; grid[r][c].checked=true;}
    }
  });
  showMsg("Respuestas reveladas.","info"); renderGrid();
}

function reset(){
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(grid[r][c]){grid[r][c].val=""; grid[r][c].checked=undefined;}
    }
  });
  sel=null; selWord=null; hideMsg();
  document.getElementById("activeClue").className="selected-clue-label";
  renderGrid(); renderClues();
}

function updateScore(){
  let correct=0, total=0;
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(grid[r][c]){total++; if(grid[r][c].val===d.word[i])correct++;}
    }
  });
  const sc=document.getElementById("sc"), tot=document.getElementById("tot");
  if(sc) sc.textContent=correct; if(tot) tot.textContent=total;
}

function showMsg(txt,type){
  const m=document.getElementById("msgbox");
  m.textContent=txt; m.className="msg show "+type;
}
function hideMsg(){const m=document.getElementById("msgbox"); if(m){m.className="msg"; m.textContent="";}}

buildGrid(); renderGrid(); renderClues();
</script>
</body>
</html>
