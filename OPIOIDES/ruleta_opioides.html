
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#wrap{padding:1rem 0 2rem}
.top{display:flex;gap:12px;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:6px 14px;font-size:12px;color:var(--color-text-secondary)}
.stat b{font-weight:500;color:var(--color-text-primary)}
.streak{background:#EAF3DE;border-radius:var(--border-radius-md);padding:6px 14px;font-size:12px;color:#27500A;font-weight:500}
.main{display:grid;grid-template-columns:260px 1fr;gap:1.5rem;align-items:start}
@media(max-width:560px){.main{grid-template-columns:1fr}}
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
canvas#wheel{border-radius:50%;border:0.5px solid var(--color-border-tertiary)}
#spin-btn{width:100%;padding:10px;font-size:14px;font-weight:500;cursor:pointer;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);color:var(--color-text-primary)}
#spin-btn:hover{background:var(--color-background-secondary)}
#spin-btn:disabled{opacity:.4;cursor:default}
.card-area{min-height:300px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:12px}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.badge.farmaco{background:#EEEDFE;color:#3C3489}
.badge.receptor{background:#E1F5EE;color:#085041}
.badge.adverso{background:#FAECE7;color:#712B13}
.badge.caso{background:#E6F1FB;color:#0C447C}
.q-text{font-size:14px;color:var(--color-text-primary);line-height:1.55;margin-bottom:1rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:9px 14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;background:transparent;text-align:left;color:var(--color-text-primary);line-height:1.4}
.opt:hover:not(:disabled){background:var(--color-background-secondary)}
.opt.correct{background:#EAF3DE;border-color:#3B6D11;color:#27500A}
.opt.wrong{background:#FCEBEB;border-color:#A32D2D;color:#791F1F}
.opt:disabled{cursor:default}
.explanation{margin-top:12px;font-size:13px;color:var(--color-text-secondary);line-height:1.5;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md)}
.next-btn{margin-top:14px;padding:9px 20px;font-size:13px;cursor:pointer;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);color:var(--color-text-primary)}
.next-btn:hover{background:var(--color-background-secondary)}
.idle{display:flex;align-items:center;justify-content:center;height:200px;font-size:13px;color:var(--color-text-secondary)}
</style>

<h2 class="sr-only">Ruleta de repaso de opioides — gira para obtener una pregunta aleatoria sobre fármacos, receptores, efectos adversos o casos clínicos</h2>
<div id="wrap">
  <div class="top">
    <div class="stat">Correctas <b id="sc">0</b></div>
    <div class="stat">Incorrectas <b id="sw">0</b></div>
    <div class="stat">Total <b id="st">0</b></div>
    <div class="streak" id="streak-box" style="display:none">Racha <b id="streak">0</b></div>
  </div>
  <div class="main">
    <div class="wheel-wrap">
      <canvas id="wheel" width="240" height="240"></canvas>
      <button id="spin-btn">Girar ruleta</button>
    </div>
    <div class="card-area" id="card-area">
      <div class="idle">Gira la ruleta para empezar</div>
    </div>
  </div>
</div>

<script>
const CATS = [
  {label:"Fármaco",    color:"#AFA9EC", text:"#26215C", badge:"farmaco"},
  {label:"Receptor",   color:"#5DCAA5", text:"#04342C", badge:"receptor"},
  {label:"Ef. adverso",color:"#F0997B", text:"#4A1B0C", badge:"adverso"},
  {label:"Caso clínico",color:"#85B7EB", text:"#042C53", badge:"caso"},
];

const QUESTIONS = {
  farmaco:[
    {q:"¿Cuál es el mecanismo de acción principal de los opioides?",opts:["Bloqueo de canales de sodio","Agonismo en receptores acoplados a proteína Gi","Antagonismo NMDA","Inhibición de COX-2"],ans:1,exp:"Los opioides actúan como agonistas en receptores acoplados a proteína Gi, inhibiendo la adenilil ciclasa, hiperpolarizando la neurona y reduciendo la liberación de neurotransmisores."},
    {q:"El remifentanilo se diferencia de otros opioides porque es metabolizado por:",opts:["CYP3A4 hepático","Esterasas plasmáticas inespecíficas","Glucuronidación renal","MAO mitocondrial"],ans:1,exp:"El remifentanilo tiene un éster susceptible a hidrólisis por esterasas inespecíficas en sangre y tejidos, lo que le da una vida media contexto-sensitiva de ~4 min independientemente de la duración de infusión."},
    {q:"¿Qué opioide tiene además actividad antagonista sobre receptores NMDA?",opts:["Fentanilo","Tramadol","Metadona","Buprenorfina"],ans:2,exp:"La metadona es un agonista mu con propiedades adicionales: antagonismo NMDA (útil en dolor crónico y neuropático) e inhibición de recaptura de serotonina/norepinefrina."},
    {q:"La buprenorfina se clasifica como:",opts:["Agonista puro mu","Antagonista puro","Agonista parcial mu / antagonista kappa","Agonista kappa selectivo"],ans:2,exp:"Buprenorfina es agonista parcial de alta afinidad en receptor mu y antagonista kappa. Tiene efecto techo para depresión respiratoria pero no para analgesia, lo que la hace más segura en ciertas poblaciones."},
    {q:"¿Cuál opioide produce menos histaminoliberación intravenosa?",opts:["Morfina","Codeína","Fentanilo","Meperidina"],ans:2,exp:"Fentanilo y sus derivados (sufentanilo, remifentanilo) no liberan histamina directamente. Morfina y meperidina sí pueden causar liberación de histamina, produciendo prurito, hipotensión y broncoespasmo."},
    {q:"El sufentanilo comparado con fentanilo es aproximadamente:",opts:["5-10× más potente","50-100× más potente","500-1000× más potente","Igual potencia"],ans:2,exp:"Sufentanilo es el opioide de uso clínico más potente: 500-1000 veces más que morfina y 5-10 veces más que fentanilo. Su alta lipofilia le da rápido inicio y distribución al SNC."},
  ],
  receptor:[
    {q:"¿Qué receptor opioide media principalmente la analgesia supraespinal y euforia?",opts:["Kappa (κ)","Delta (δ)","Mu (μ)","Sigma (σ)"],ans:2,exp:"El receptor mu (μ) es el principal mediador de analgesia, euforia, sedación, depresión respiratoria, disminución de motilidad GI y dependencia física."},
    {q:"La activación del receptor kappa produce:",opts:["Euforia y miosis","Disforia, sedación y alucinaciones","Analgesia sin sedación","Broncodilatación"],ans:1,exp:"El receptor kappa (κ) produce disforia, alucinaciones y sedación. Esta es la razón por la que agonistas kappa puros no son útiles clínicamente — la disforia los hace intolerables."},
    {q:"Los receptores opioides están acoplados a proteína:",opts:["Gs (estimuladora)","Gi (inhibidora)","Gq (fosfolipasa C)","Gk (canales K)"],ans:1,exp:"Los receptores opioides (mu, kappa, delta) están acoplados a proteína Gi/Go. Esto inhibe la adenilil ciclasa, abre canales de K+ (hiperpolarización) y cierra canales de Ca2+ voltaje-dependientes."},
    {q:"¿Cuál receptor opioide modula principalmente el estado de ánimo y tiene distribución predominante en sistema límbico?",opts:["Mu","Kappa","Delta","Nociceptina/ORL1"],ans:2,exp:"El receptor delta (δ) tiene mayor distribución en el sistema límbico y modula el humor, la depresión y la analgesia. Algunos fármacos experimentales actúan en delta para analgesia con menos dependencia."},
    {q:"La tolerancia opioide se desarrolla principalmente por:",opts:["Downregulation de receptores mu y desensibilización","Inducción de CYP450","Aumento de producción de endorfinas","Cambios en receptor GABA"],ans:0,exp:"La tolerancia implica desensibilización del receptor (fosforilación por GRKs), internalización (downregulation) y cambios en señalización intracelular. También hay componentes de neuroadaptación central (upregulation de AMPc)."},
  ],
  adverso:[
    {q:"¿Cuál es el efecto adverso potencialmente más letal de los opioides?",opts:["Náusea","Depresión respiratoria","Prurito","Estreñimiento"],ans:1,exp:"La depresión respiratoria es el efecto adverso más peligroso. Los opioides reducen la respuesta ventilatoria al CO2 y la hipoxia. El receptor mu en el tronco encefálico (núcleo del rafe y centro respiratorio) es el mediador principal."},
    {q:"La miosis por opioides es causada por acción en:",opts:["Corteza visual","Núcleo de Edinger-Westphal (via parasimpática)","Ganglios simpáticos cervicales","Retina directamente"],ans:1,exp:"Los opioides estimulan el núcleo de Edinger-Westphal, aumentando el tono parasimpático al músculo constrictor del iris, produciendo miosis característica. No genera tolerancia a este efecto."},
    {q:"El prurito inducido por morfina espinal se debe principalmente a:",opts:["Liberación de histamina medular","Activación directa de receptor mu en asta dorsal","Hiperalgesia opioide","Metabolito activo morfina-3-glucurónido"],ans:1,exp:"El prurito espinal con opioides intratecales/epidurales es principalmente central — mediado por receptor mu en el asta dorsal. No se trata bien con antihistamínicos; responde mejor a naloxona en dosis bajas o nalbufina."},
    {q:"¿Qué efecto adverso de opioides NO desarrolla tolerancia con el uso crónico?",opts:["Sedación","Náusea","Estreñimiento y miosis","Depresión respiratoria"],ans:2,exp:"El estreñimiento y la miosis son los únicos efectos adversos de opioides que no desarrollan tolerancia significativa. Por eso los pacientes en opioides crónicos siempre requieren laxantes, pero la sedación y náusea típicamente mejoran."},
    {q:"La hiperalgesia inducida por opioides (HIO) se relaciona con:",opts:["Downregulation de receptores mu","Activación de receptores NMDA y sensibilización central","Deficiencia de endorfinas endógenas","Acumulación de morfina-6-glucurónido"],ans:1,exp:"La HIO implica activación del receptor NMDA, upregulation de PKC, cambios en dinorfina espinal y sensibilización glial (astrocitos y microglía). Es paradójica: más opioide = más dolor. La metadona (antagonista NMDA) puede ayudar."},
  ],
  caso:[
    {q:"Paciente post-cirugía mayor con SpO2 88%, FR 6/min, pupilas puntiformes, sin responder. ¿Primer paso?",opts:["Flumazenil IV","Naloxona 0.4mg IV en bolo","Naloxona 0.04mg IV titulada","Intubar inmediatamente"],ans:2,exp:"Naloxona titulada (0.04mg cada 2-3 min) es preferible al bolo de 0.4mg para evitar reversión brusca con dolor severo, hipertensión, edema pulmonar y síndrome de abstinencia. El objetivo es SpO2 >94% y FR >10, no despertar completo."},
    {q:"Paciente con dolor crónico en metadona 80mg/día requiere cirugía. ¿Cuál es la estrategia correcta?",opts:["Suspender metadona 24h antes","Continuar metadona + analgesia multimodal + opioides adicionales","Sustituir por morfina equivalente","No dar opioides adicionales por riesgo de sobredosis"],ans:1,exp:"En pacientes con metadona crónica, se debe continuar la dosis base (tolerancia establecida) y agregar analgesia multimodal. Necesitarán dosis mayores de opioides adicionales por tolerancia cruzada. Suspender la metadona puede precipitar abstinencia."},
    {q:"¿En cuál de estos pacientes usarías remifentanilo como primera opción?",opts:["Insuficiencia renal crónica severa en cirugía larga","Cirugía ambulatoria de 30 min","Paciente con historia de náusea postoperatoria severa","Cirugía de columna en prono con neuromonitoreo"],ans:0,exp:"En insuficiencia renal, morfina acumula metabolitos activos (M6G) y meperidina acumula normeperidina (convulsivante). El remifentanilo es ideal porque se metaboliza por esterasas plasmáticas — la función renal no afecta su farmacocinética."},
    {q:"Tras infusión prolongada de remifentanilo, al despertar el paciente tiene dolor severo 9/10. Esto ocurre porque:",opts:["El remifentanilo se acumuló y produce rebote","Hiperalgesia aguda inducida por remifentanilo y ausencia de analgesia residual","El paciente era tolerante a opioides","Falla del neuromonitoreo intraoperatorio"],ans:1,exp:"El remifentanilo tiene contexto-sensitiva muy corta y no deja analgesia residual. Además, infusiones prolongadas pueden causar hiperalgesia aguda (vía NMDA). La estrategia es siempre preparar analgesia de transición 20-30 min antes del despertar."},
  ]
};

let sc=0,sw=0,streak=0,spinning=false,answered=false,usedQ={farmaco:[],receptor:[],adverso:[],caso:[]};

const catKeys=["farmaco","receptor","adverso","caso"];
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
let angle=0;

function drawWheel(rot){
  ctx.clearRect(0,0,240,240);
  const cx=120,cy=120,r=112,n=CATS.length;
  const arc=Math.PI*2/n;
  CATS.forEach((c,i)=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,rot+i*arc,rot+(i+1)*arc);
    ctx.fillStyle=c.color;
    ctx.fill();
    ctx.strokeStyle="var(--color-background-primary)";
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot+(i+0.5)*arc);
    ctx.textAlign="center";
    ctx.fillStyle=c.text;
    ctx.font="500 12px var(--font-sans)";
    ctx.fillText(c.label,r*0.62,4);
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx,cy,14,0,Math.PI*2);
  ctx.fillStyle="var(--color-background-primary)";
  ctx.fill();
  ctx.strokeStyle="var(--color-border-secondary)";
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+r+8,cy-7);
  ctx.lineTo(cx+r+22,cy);
  ctx.lineTo(cx+r+8,cy+7);
  ctx.fillStyle="#378ADD";
  ctx.fill();
}

drawWheel(angle);

function getQ(cat){
  const pool=QUESTIONS[cat];
  let avail=pool.map((_,i)=>i).filter(i=>!usedQ[cat].includes(i));
  if(avail.length===0){usedQ[cat]=[];avail=pool.map((_,i)=>i);}
  const idx=avail[Math.floor(Math.random()*avail.length)];
  usedQ[cat].push(idx);
  return pool[idx];
}

function spin(){
  if(spinning||answered) return;
  spinning=true;
  document.getElementById("spin-btn").disabled=true;
  const totalRot=(5+Math.random()*5)*Math.PI*2;
  const dur=3000;
  const start=performance.now();
  const startAngle=angle;
  function step(now){
    const t=Math.min((now-start)/dur,1);
    const ease=1-Math.pow(1-t,4);
    angle=startAngle+totalRot*ease;
    drawWheel(angle);
    if(t<1){requestAnimationFrame(step);}
    else{
      angle=angle%(Math.PI*2);
      spinning=false;
      const arc=Math.PI*2/CATS.length;
      const ptr=(-angle+Math.PI*2)%(Math.PI*2);
      const catIdx=Math.floor(ptr/arc)%CATS.length;
      showQuestion(catKeys[catIdx],CATS[catIdx]);
    }
  }
  requestAnimationFrame(step);
}

function showQuestion(catKey,catMeta){
  const q=getQ(catKey);
  answered=false;
  const area=document.getElementById("card-area");
  let html=`<div class="card"><span class="badge ${catMeta.badge}">${catMeta.label}</span><p class="q-text">${q.q}</p><div class="opts">`;
  q.opts.forEach((o,i)=>{
    html+=`<button class="opt" onclick="answer(this,${i},${q.ans})">${o}</button>`;
  });
  html+=`</div><div id="exp" style="display:none" class="explanation">${q.exp}</div></div>`;
  area.innerHTML=html;
}

function answer(btn,chosen,correct){
  if(answered) return;
  answered=true;
  const opts=btn.closest(".opts").querySelectorAll(".opt");
  opts.forEach((o,i)=>{
    o.disabled=true;
    if(i===correct) o.classList.add("correct");
    else if(i===chosen&&chosen!==correct) o.classList.add("wrong");
  });
  document.getElementById("exp").style.display="block";
  if(chosen===correct){sc++;streak++;}
  else{sw++;streak=0;}
  document.getElementById("sc").textContent=sc;
  document.getElementById("sw").textContent=sw;
  document.getElementById("st").textContent=sc+sw;
  const sb=document.getElementById("streak-box");
  if(streak>=2){sb.style.display="";document.getElementById("streak").textContent=streak;}
  else sb.style.display="none";
  const card=btn.closest(".card");
  const nb=document.createElement("button");
  nb.className="next-btn";
  nb.textContent="Siguiente pregunta";
  nb.onclick=()=>{
    answered=false;
    document.getElementById("card-area").innerHTML='<div class="idle">Gira la ruleta para continuar</div>';
    document.getElementById("spin-btn").disabled=false;
    spin();
  };
  card.appendChild(nb);
}

document.getElementById("spin-btn").onclick=spin;
</script>
