<!DOCTYPE html>
<div id="app"></div>
<style>
*{box-sizing:border-box;margin:0;padding:0}
#app{font-family:var(--font-sans);padding:1rem 0 2rem;max-width:700px}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.title{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.subtitle{font-size:13px;color:var(--color-text-secondary);margin-bottom:1.25rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}
.pill{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--color-text-secondary)}
.pill span{font-weight:500;color:var(--color-text-primary)}
.btn{background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px 14px;font-size:13px;cursor:pointer;color:var(--color-text-primary)}
.btn:hover{background:var(--color-background-secondary)}
.btn.primary{border-color:#185FA5;color:#185FA5}
.btn.primary:hover{background:#E6F1FB}
.grid-wrap{overflow-x:auto;margin-bottom:1.5rem}
.grid{display:inline-grid;gap:2px;background:var(--color-border-tertiary);padding:2px;border-radius:6px}
.cell{width:36px;height:36px;position:relative;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:2px}
.cell.blk{background:var(--color-text-primary);opacity:0.82;border-color:transparent;pointer-events:none}
.cell.hi{background:#dbeafe}
.cell.active{background:#bfdbfe;border-color:#378ADD}
.cell.ok{background:#dcfce7}
.cell.err{background:#fee2e2}
.cell input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-size:14px;font-weight:500;text-transform:uppercase;color:var(--color-text-primary);outline:none;caret-color:transparent;cursor:pointer;padding:0}
.cnum{position:absolute;top:1px;left:2px;font-size:7.5px;font-weight:500;color:var(--color-text-tertiary);line-height:1;pointer-events:none}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:520px){.clues{grid-template-columns:1fr}.cell{width:30px;height:30px}.cell input{font-size:12px}}
.cgroup h4{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:10px}
.ci{display:flex;gap:6px;padding:5px 6px;border-radius:4px;cursor:pointer;align-items:flex-start;margin-bottom:2px}
.ci:hover{background:var(--color-background-secondary)}
.ci.sel{background:#E6F1FB}
.ci .cn{font-size:11px;font-weight:500;color:var(--color-text-secondary);min-width:16px;padding-top:1px}
.ci .ct{font-size:12px;color:var(--color-text-secondary);line-height:1.45}
.ci.sel .ct{color:#185FA5;font-weight:500}
.msg{font-size:13px;padding:8px 12px;border-radius:var(--border-radius-md);margin-bottom:1rem;display:none}
.msg.show{display:block}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fee2e2;color:#991b1b}
.msg.info{background:var(--color-background-secondary);color:var(--color-text-secondary)}
</style>
<script>
const DATA = [
  {n:1,  word:"FENTANILO",  dir:"H", r:0, c:0, clue:"Opioide sintético 100× más potente que morfina, muy lipofílico"},
  {n:2,  word:"MORFINA",    dir:"V", r:0, c:6, clue:"Opioide prototipo; metabolito activo: morfina-6-glucurónido"},
  {n:3,  word:"NALOXONA",   dir:"H", r:2, c:0, clue:"Antagonista puro, revierte depresión respiratoria por opioides"},
  {n:4,  word:"REMIFENTANILO",dir:"H",r:4,c:0, clue:"Éster degradado por esterasas inespecíficas; contexto-sensitivo muy corto"},
  {n:5,  word:"KAPPA",      dir:"V", r:4, c:5, clue:"Receptor opioide que produce disforia y sedación espinal"},
  {n:6,  word:"MIOSIS",     dir:"H", r:6, c:2, clue:"Signo pupilar clásico de intoxicación por opioides"},
  {n:7,  word:"TRAMADOL",   dir:"V", r:4, c:11,clue:"Opioide débil + inhibidor de recaptura de serotonina/norepinefrina"},
  {n:8,  word:"DELTA",      dir:"H", r:8, c:0, clue:"Receptor opioide modulador de humor y analgesia supraespinal"},
  {n:9,  word:"METADONA",   dir:"V", r:6, c:3, clue:"Opioide de acción prolongada + antagonista NMDA; útil en dolor crónico"},
  {n:10, word:"MU",         dir:"H", r:10,c:0, clue:"Receptor opioide principal; media analgesia, euforia y dependencia"},
  {n:11, word:"SUFENTANILO",dir:"H", r:12,c:0, clue:"El más potente para uso clínico; 500-1000× morfina"},
  {n:12, word:"PRURITO",    dir:"V", r:10,c:8, clue:"Efecto adverso común con morfina espinal; mediado por receptor mu"},
  {n:13, word:"NAUSEA",     dir:"H", r:14,c:1, clue:"Efecto adverso emético por acción en zona gatillo quimiorreceptora"},
  {n:14, word:"BUPRENORFINA",dir:"H",r:16,c:0, clue:"Agonista parcial mu y antagonista kappa; efecto techo en depresión respiratoria"},
];

const ROWS = 18, COLS = 13;
let grid = [], sel = null, selDir = "H", selWord = null;

function buildGrid(){
  grid = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(!grid[r][c]) grid[r][c]={letter:d.word[i],val:"",num:null};
      else grid[r][c].letter=d.word[i];
    }
    grid[d.r][d.c].num = d.n;
  });
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <h2 class="sr-only">Crucigrama de opioides — nivel intermedio para especialistas en anestesia</h2>
    <div class="title">Opioides en anestesia</div>
    <div class="subtitle">Nivel intermedio · fármacos, receptores, mecanismos y efectos adversos</div>
    <div class="toolbar">
      <div class="pill">Correctas: <span id="sc">0</span>/<span id="tot">0</span></div>
      <button class="btn primary" onclick="check()">Verificar</button>
      <button class="btn" onclick="reveal()">Revelar todo</button>
      <button class="btn" onclick="reset()">Reiniciar</button>
    </div>
    <div id="msgbox" class="msg"></div>
    <div class="grid-wrap"><div class="grid" id="g" style="grid-template-columns:repeat(${COLS},36px);grid-template-rows:repeat(${ROWS},36px)"></div></div>
    <div class="clues">
      <div class="cgroup"><h4>Horizontal</h4><div id="clH"></div></div>
      <div class="cgroup"><h4>Vertical</h4><div id="clV"></div></div>
    </div>
  `;
  renderGrid();
  renderClues();
}

function renderGrid(){
  const g=document.getElementById("g");
  g.innerHTML="";
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cd=document.createElement("div");
      cd.className="cell";
      cd.dataset.r=r; cd.dataset.c=c;
      if(!grid[r][c]){cd.classList.add("blk"); g.appendChild(cd); continue;}
      const cell=grid[r][c];
      if(isHighlighted(r,c)) cd.classList.add(selWord?"hi":"");
      if(sel&&sel[0]===r&&sel[1]===c) cd.classList.add("active");
      if(cell.num){const sp=document.createElement("span");sp.className="cnum";sp.textContent=cell.num;cd.appendChild(sp);}
      const inp=document.createElement("input");
      inp.maxLength=1;
      inp.value=cell.val||"";
      if(cell.checked===true) cd.classList.add("ok");
      else if(cell.checked===false) cd.classList.add("err");
      inp.addEventListener("click",()=>handleClick(r,c,inp));
      inp.addEventListener("keydown",(e)=>handleKey(e,r,c));
      cd.appendChild(inp);
      g.appendChild(cd);
    }
  }
  updateScore();
}

function isHighlighted(r,c){
  if(!selWord) return false;
  const w=DATA.find(d=>d.n===selWord);
  if(!w) return false;
  for(let i=0;i<w.word.length;i++){
    const wr=w.dir==="H"?w.r:w.r+i, wc=w.dir==="H"?w.c+i:w.c;
    if(wr===r&&wc===c) return true;
  }
  return false;
}

function handleClick(r,c,inp){
  if(sel&&sel[0]===r&&sel[1]===c){
    selDir=selDir==="H"?"V":"H";
    const w=findWord(r,c,selDir)||findWord(r,c,selDir==="H"?"V":"H");
    selWord=w?w.n:null;
    if(w) selDir=w.dir;
  } else {
    sel=[r,c];
    const wH=findWord(r,c,"H"), wV=findWord(r,c,"V");
    const w=wH||wV;
    selDir=w?w.dir:"H";
    selWord=w?w.n:null;
  }
  renderGrid();
  inp.focus();
  if(selWord) highlightClue(selWord);
}

function findWord(r,c,dir){
  return DATA.find(d=>{
    if(d.dir!==dir) return false;
    for(let i=0;i<d.word.length;i++){
      const wr=d.dir==="H"?d.r:d.r+i, wc=d.dir==="H"?d.c+i:d.c;
      if(wr===r&&wc===c) return true;
    }
    return false;
  });
}

function handleKey(e,r,c){
  const cell=grid[r][c];
  if(!cell) return;
  if(e.key==="Backspace"){
    if(cell.val){cell.val="";cell.checked=undefined;}
    else moveBack(r,c);
    renderGrid(); refocus(r,c); e.preventDefault(); return;
  }
  if(e.key.length===1&&e.key.match(/[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/)){
    cell.val=e.key.toUpperCase(); cell.checked=undefined;
    moveNext(r,c);
    renderGrid(); e.preventDefault();
  }
  if(e.key==="ArrowRight"){sel=[r,c+1<COLS&&grid[r][c+1]?c+1:c];selDir="H";renderGrid();refocus(...sel);}
  if(e.key==="ArrowLeft"){sel=[r,c-1>=0&&grid[r][c-1]?c-1:c];selDir="H";renderGrid();refocus(...sel);}
  if(e.key==="ArrowDown"){sel=[r+1<ROWS&&grid[r+1]&&grid[r+1][c]?r+1:r,c];selDir="V";renderGrid();refocus(...sel);}
  if(e.key==="ArrowUp"){sel=[r-1>=0&&grid[r-1]&&grid[r-1][c]?r-1:r,c];selDir="V";renderGrid();refocus(...sel);}
}

function moveNext(r,c){
  if(!selWord){sel=[r,c];return;}
  const w=DATA.find(d=>d.n===selWord);
  if(!w) return;
  for(let i=0;i<w.word.length-1;i++){
    const wr=w.dir==="H"?w.r:w.r+i, wc=w.dir==="H"?w.c+i:w.c;
    if(wr===r&&wc===c){
      const nr=w.dir==="H"?w.r:w.r+i+1, nc=w.dir==="H"?w.c+i+1:w.c;
      sel=[nr,nc]; setTimeout(()=>refocus(nr,nc),10); return;
    }
  }
}

function moveBack(r,c){
  if(!selWord){sel=[r,c];return;}
  const w=DATA.find(d=>d.n===selWord);
  if(!w) return;
  for(let i=1;i<w.word.length;i++){
    const wr=w.dir==="H"?w.r:w.r+i, wc=w.dir==="H"?w.c+i:w.c;
    if(wr===r&&wc===c){
      const pr=w.dir==="H"?w.r:w.r+i-1, pc=w.dir==="H"?w.c+i-1:w.c;
      sel=[pr,pc]; setTimeout(()=>refocus(pr,pc),10); return;
    }
  }
}

function refocus(r,c){
  const cells=document.querySelectorAll(".cell");
  cells.forEach(cd=>{
    if(parseInt(cd.dataset.r)===r&&parseInt(cd.dataset.c)===c){
      const inp=cd.querySelector("input");
      if(inp) inp.focus();
    }
  });
}

function renderClues(){
  const hDiv=document.getElementById("clH"), vDiv=document.getElementById("clV");
  DATA.filter(d=>d.dir==="H").sort((a,b)=>a.n-b.n).forEach(d=>{
    hDiv.appendChild(clueEl(d));
  });
  DATA.filter(d=>d.dir==="V").sort((a,b)=>a.n-b.n).forEach(d=>{
    vDiv.appendChild(clueEl(d));
  });
}

function clueEl(d){
  const div=document.createElement("div");
  div.className="ci"; div.id="clue-"+d.n;
  div.innerHTML=`<span class="cn">${d.n}</span><span class="ct">${d.clue}</span>`;
  div.onclick=()=>{
    selWord=d.n; selDir=d.dir; sel=[d.r,d.c];
    renderGrid(); highlightClue(d.n);
    setTimeout(()=>refocus(d.r,d.c),20);
  };
  return div;
}

function highlightClue(n){
  document.querySelectorAll(".ci").forEach(el=>el.classList.remove("sel"));
  const el=document.getElementById("clue-"+n);
  if(el){el.classList.add("sel");el.scrollIntoView({block:"nearest"});}
}

function check(){
  let correct=0,total=0;
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      const cell=grid[r][c];
      if(!cell) continue;
      total++;
      if(cell.val===d.word[i]){cell.checked=true;correct++;}
      else if(cell.val) cell.checked=false;
      else cell.checked=undefined;
    }
  });
  showMsg(correct===total&&total>0?`¡Perfecto! Todas las ${total} letras correctas.`:correct===0?`Ninguna letra correcta aún. ¡Sigue intentando!`:`${correct} de ${total} letras correctas.`,correct===total&&total>0?"good":correct<total/2?"bad":"info");
  renderGrid();
}

function reveal(){
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(grid[r][c]){grid[r][c].val=d.word[i];grid[r][c].checked=true;}
    }
  });
  showMsg("Respuestas reveladas.","info");
  renderGrid();
}

function reset(){
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(grid[r][c]){grid[r][c].val="";grid[r][c].checked=undefined;}
    }
  });
  sel=null; selWord=null;
  hideMsg();
  renderGrid();
  renderClues();
}

function updateScore(){
  let correct=0,total=0;
  DATA.forEach(d=>{
    for(let i=0;i<d.word.length;i++){
      const r=d.dir==="H"?d.r:d.r+i, c=d.dir==="H"?d.c+i:d.c;
      if(grid[r][c]){total++;if(grid[r][c].val===d.word[i])correct++;}
    }
  });
  const sc=document.getElementById("sc"),tot=document.getElementById("tot");
  if(sc) sc.textContent=correct;
  if(tot) tot.textContent=total;
}

function showMsg(txt,type){
  const m=document.getElementById("msgbox");
  m.textContent=txt; m.className="msg show "+type;
}
function hideMsg(){const m=document.getElementById("msgbox");if(m){m.className="msg";m.textContent="";}}

buildGrid(); render();
</script>
