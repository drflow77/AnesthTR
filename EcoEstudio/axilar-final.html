<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloqueo Axilar | AnesthTR</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--panel:#111827;--panel2:#1a2235;--border:#2a3a5c;--accent:#00d4ff;--text:#e2e8f0;--muted:#64748b;--mono:"Space Mono",monospace;--sans:"DM Sans",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,212,255,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(124,58,237,.05) 0%,transparent 50%);pointer-events:none;z-index:0;}
header{position:relative;z-index:10;padding:13px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(10,14,26,.92);backdrop-filter:blur(12px);}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;}
.logo span{color:var(--muted);}
.mode-toggle{display:flex;gap:6px;}
.mode-btn{font-family:var(--mono);font-size:11px;padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.06em;text-transform:uppercase;}
.mode-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.mode-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 20px;}
.block-title{text-align:center;margin-bottom:20px;}
.block-title h1{font-family:var(--mono);font-size:19px;color:var(--accent);letter-spacing:.05em;}
.block-title p{font-size:12px;color:var(--muted);margin-top:4px;}
.game-layout{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start;}
.usg-panel{background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.usg-header{background:var(--panel2);padding:9px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.usg-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.usg-lbl{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.usg-freq{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);}
.usg-container{position:relative;width:100%;}
#usgImg{width:100%;display:block;}
.ov{position:absolute;border-radius:50%;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;transform:scale(.7);mix-blend-mode:screen;}
.ov.show{opacity:.72;transform:scale(1);}
.ov.pop{animation:ovPop .5s ease forwards;}
@keyframes ovPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.12);opacity:.8}100%{transform:scale(1);opacity:.72}}
.dz{position:absolute;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);box-shadow:0 0 10px 2px rgba(255,255,255,.45),inset 0 0 8px rgba(255,255,255,.08);transition:all .22s;display:flex;align-items:center;justify-content:center;animation:dzPulse 2s ease-in-out infinite;}
.dz:hover{border-color:#fff;background:rgba(255,255,255,.08);box-shadow:0 0 22px 6px rgba(255,255,255,.6),inset 0 0 14px rgba(255,255,255,.12);}
.dz.over{border-color:var(--accent);background:rgba(0,212,255,.12);transform:scale(1.08);box-shadow:0 0 24px 6px rgba(0,212,255,.6),inset 0 0 14px rgba(0,212,255,.15);animation:none;}
.dz.correct{border-color:#10b981;}
.dz.wrong{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}} @keyframes dzPulse{0%,100%{box-shadow:0 0 10px 2px rgba(255,255,255,.45),inset 0 0 8px rgba(255,255,255,.08)}50%{box-shadow:0 0 18px 5px rgba(255,255,255,.7),inset 0 0 12px rgba(255,255,255,.15)}}
.dz-lbl{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.7);text-align:center;pointer-events:none;font-weight:700;text-shadow:0 0 6px rgba(0,0,0,.8);}
.right-panel{display:flex;flex-direction:column;gap:8px;}
.panel-title{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.si{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:10px;}
.si:hover{border-color:rgba(255,255,255,.3);transform:translateX(-2px);}
.si.active{border-color:var(--ic,#fff);background:color-mix(in srgb,var(--ic,#fff) 10%,var(--panel2));}
.si-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.si-name{font-size:12px;font-weight:500;flex:1;line-height:1.3;}
.si-tag{font-family:var(--mono);font-size:9px;color:var(--muted);}
.show-all{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.06em;text-transform:uppercase;width:100%;}
.show-all:hover,.show-all.on{border-color:var(--accent);color:var(--accent);}
.show-all.on{background:rgba(0,212,255,.08);}
.exp-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11px;line-height:1.65;min-height:90px;}
.exp-title{font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:6px;letter-spacing:.05em;}
.exp-body{color:#94a3b8;}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 12px 9px 22px;font-size:12px;font-weight:500;cursor:grab;user-select:none;transition:all .18s;position:relative;}
.chip::before{content:"⠿";position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--muted);}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateX(-2px);}
.chip.dragging{opacity:.3;}
.chip.used{opacity:.2;pointer-events:none;text-decoration:line-through;}
.score-row{display:flex;gap:14px;justify-content:center;padding:4px 0;}
.score-item{font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:6px;}
.score-item .v{font-size:20px;font-weight:700;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.ld{width:9px;height:9px;border-radius:50%;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-14px);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 22px;font-family:var(--mono);font-size:12px;opacity:0;transition:all .28s;z-index:200;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:#10b981;color:#10b981;}
.toast.err{border-color:#ef4444;color:#ef4444;}
.win{display:none;position:fixed;inset:0;background:rgba(10,14,26,.96);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;}
.win.show{display:flex;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.win h2{font-family:var(--mono);font-size:30px;color:var(--accent);letter-spacing:.1em;}
.win-score{font-family:var(--mono);font-size:54px;font-weight:700;}
.ga{color:#10b981;}.gb{color:#f59e0b;}.gc{color:#ef4444;}
.wbtn{margin-top:6px;background:var(--accent);color:#000;border:none;border-radius:10px;padding:11px 28px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.wbtn:hover{transform:scale(1.04);box-shadow:0 0 20px rgba(0,212,255,.4);}
.wbtn2{background:var(--panel);color:var(--accent);border:1px solid var(--accent);}
</style>
</head>

<div class="toast" id="toast"></div>
<div class="win" id="win">
  <div style="font-size:46px">&#127919;</div>
  <h2>EXAMEN COMPLETADO</h2>
  <div style="font-size:13px;color:var(--muted);font-family:var(--mono)" id="winSub"></div>
  <div class="win-score" id="winScore"></div>
  <div style="font-size:11px;color:var(--muted);font-family:var(--mono)" id="winGrade"></div>
  <button class="wbtn" onclick="restartExam()">REPETIR &rarr;</button>
  <button class="wbtn wbtn2" onclick="setMode('study');document.getElementById('win').classList.remove('show')">IR A ESTUDIO</button>
</div>
<script>
const S=[
  {id:"arteria",name:"Arteria Axilar",tag:"ARTERIA",color:"#ef4444",cx:42.3,cy:22.2,w:9,h:13,exp:"La arteria axilar es la referencia central. Aparece redonda, anecogenica, pulsatil. Los nervios la rodean en posicion horaria: mediano 9-12h, cubital 6-9h, radial 3-6h. Confirma con Doppler color."},
  {id:"vena",name:"Vena Axilar",tag:"VENA",color:"#3b82f6",cx:36.5,cy:24.3,w:7,h:10,exp:"La vena axilar acompana a la arteria, es compresible y no pulsatil. Suele estar medial e inferior. Identificarla evita puncion vascular accidental."},
  {id:"mediano",name:"N. Mediano",tag:"NERVIO",color:"#f5d000",cx:47.7,cy:13.5,w:7,h:9,exp:"El nervio mediano esta a las 9-12h de la arteria. Oval, hipoecogenico con halo hiperecoico (perineurio). Inerva flexion de muneca, pronacion y zona tenar."},
  {id:"cubital",name:"N. Cubital",tag:"NERVIO",color:"#f5d000",cx:34.2,cy:15.6,w:7,h:9,exp:"El nervio cubital esta a las 6-9h de la arteria (inferior-medial). Inerva musculatura hipotenar e interoseos. Su bloqueo incompleto es la causa mas frecuente de falla en el axilar."},
  {id:"radial",name:"N. Radial",tag:"NERVIO",color:"#f5d000",cx:40.5,cy:34.5,w:7,h:9,exp:"El nervio radial esta a las 3-6h, posterior a la arteria. Es el mas profundo y dificil de bloquear. Inerva extension de muneca y dedos. Segunda causa de bloqueo incompleto."},
  {id:"musculocutaneo",name:"N. Musculocutaneo",tag:"NERVIO",color:"#f5d000",cx:59,cy:56.2,w:7,h:9,exp:"El musculocutaneo abandona la vaina axilar y viaja dentro del musculo coracobraquial, lateral al paquete neurovascular. Requiere inyeccion separada para bloqueo completo del codo."},
  {id:"coracobraquial",name:"M. Coracobraquial",tag:"MUSCULO",color:"#b45309",cx:66.4,cy:73,w:13,h:16,exp:"El musculo coracobraquial es el punto de referencia para localizar el nervio musculocutaneo. Se identifica como masa muscular estriada lateral al paquete neurovascular."}
];
let mode="study",activeId=null,showAll=false,exam={solved:new Set(),correct:0,wrong:0,tries:0,dragging:null};
function buildOverlays(){document.querySelectorAll(".ov,.dz").forEach(e=>e.remove());S.forEach(s=>{const el=document.createElement("div");el.className="ov";el.id="ov_"+s.id;el.style.left=(s.cx-s.w/2)+"%";el.style.top=(s.cy-s.h/2)+"%";el.style.width=s.w+"%";el.style.height=s.h+"%";el.style.background=s.color;document.getElementById("usgC").appendChild(el);});}
function renderStudy(){const p=document.getElementById("rightPanel");p.innerHTML="";const btn=document.createElement("button");btn.className="show-all"+(showAll?" on":"");btn.textContent=showAll?"Ocultar Todas":"Mostrar Todas";btn.onclick=toggleAll;p.appendChild(btn);const t=document.createElement("div");t.className="panel-title";t.style.marginTop="8px";t.textContent="Estructuras";p.appendChild(t);S.forEach(s=>{const el=document.createElement("div");el.className="si"+(activeId===s.id?" active":"");el.style.setProperty("--ic",s.color);el.innerHTML="<div class='si-dot' style='background:"+s.color+"'></div><span class='si-name'>"+s.name+"</span><span class='si-tag'>"+s.tag+"</span>";el.onclick=()=>selectStruct(s.id);p.appendChild(el);});const exp=document.createElement("div");exp.className="exp-box";exp.id="expBox";const active=S.find(x=>x.id===activeId);exp.innerHTML=active?"<div class='exp-title'>"+active.name.toUpperCase()+"</div><div class='exp-body'>"+active.exp+"</div>":"<div class='exp-title'>CLINICA</div><div class='exp-body' style='color:var(--muted);font-style:italic'>Selecciona una estructura para ver su descripcion.</div>";p.appendChild(exp);}
function selectStruct(id){if(mode!=="study")return;if(activeId===id&&!showAll){activeId=null;document.getElementById("ov_"+id)?.classList.remove("show","pop");renderStudy();return;}if(activeId&&!showAll)document.getElementById("ov_"+activeId)?.classList.remove("show","pop");activeId=id;const ov=document.getElementById("ov_"+id);if(ov){ov.classList.remove("pop");void ov.offsetWidth;ov.classList.add("show","pop");}renderStudy();}
function toggleAll(){showAll=!showAll;S.forEach(s=>{const ov=document.getElementById("ov_"+s.id);if(!ov)return;if(showAll){ov.classList.remove("pop");void ov.offsetWidth;ov.classList.add("show","pop");}else if(s.id!==activeId)ov.classList.remove("show","pop");});renderStudy();}
function renderExam(){document.querySelectorAll(".dz").forEach(e=>e.remove());const p=document.getElementById("rightPanel");p.innerHTML="";const t=document.createElement("div");t.className="panel-title";t.textContent="Arrastra al lugar correcto";p.appendChild(t);const shuffled=[...S].sort(()=>Math.random()-.5);shuffled.forEach(s=>{const c=document.createElement("div");c.className="chip";c.textContent=s.name;c.draggable=true;c.dataset.id=s.id;c.addEventListener("dragstart",e=>{exam.dragging=s.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";});c.addEventListener("dragend",()=>c.classList.remove("dragging"));p.appendChild(c);});const sr=document.createElement("div");sr.className="score-row";sr.innerHTML="<div class='score-item' style='color:#10b981'><span>&#10003;</span><span class='v' id='sc'>0</span></div><div class='score-item' style='color:#ef4444'><span>&#10007;</span><span class='v' id='sw'>0</span></div><div class='score-item' style='color:var(--muted)'><span style='font-size:10px'>tries</span><span class='v' id='st'>0</span></div>";p.appendChild(sr);S.forEach(s=>{const dz=document.createElement("div");dz.className="dz";dz.dataset.id=s.id;dz.style.left=(s.cx-s.w/2)+"%";dz.style.top=(s.cy-s.h/2)+"%";dz.style.width=s.w+"%";dz.style.height=s.h+"%";const lbl=document.createElement("div");lbl.className="dz-lbl";lbl.textContent="?";dz.appendChild(lbl);dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});dz.addEventListener("dragleave",()=>dz.classList.remove("over"));dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");onDrop(s.id,s);});document.getElementById("usgC").appendChild(dz);});}
function onDrop(zoneId,struct){if(!exam.dragging||exam.solved.has(zoneId))return;exam.tries++;document.getElementById("st").textContent=exam.tries;const dz=document.querySelector(".dz[data-id='"+zoneId+"']");const chip=document.querySelector(".chip[data-id='"+exam.dragging+"']");if(zoneId===exam.dragging){exam.correct++;exam.solved.add(zoneId);dz.classList.add("correct");dz.style.borderColor=struct.color;dz.querySelector(".dz-lbl").textContent=struct.name;dz.querySelector(".dz-lbl").style.color=struct.color;const ov=document.getElementById("ov_"+zoneId);if(ov){ov.classList.remove("pop");void ov.offsetWidth;ov.classList.add("show","pop");}if(chip){chip.classList.add("used");chip.draggable=false;}document.getElementById("sc").textContent=exam.correct;showToast("Correcto: "+struct.name,"ok");if(exam.solved.size===S.length)setTimeout(showWin,700);}else{exam.wrong++;dz.classList.add("wrong");setTimeout(()=>dz.classList.remove("wrong"),450);document.getElementById("sw").textContent=exam.wrong;showToast("Incorrecto, intenta de nuevo","err");}}
function setMode(m){mode=m;document.getElementById("btnS").className="mode-btn"+(m==="study"?" active":"");document.getElementById("btnE").className="mode-btn"+(m==="exam"?" active":"");S.forEach(s=>{const ov=document.getElementById("ov_"+s.id);if(ov)ov.classList.remove("show","pop");});showAll=false;activeId=null;if(m==="study"){document.querySelectorAll(".dz").forEach(e=>e.remove());renderStudy();}else{exam={solved:new Set(),correct:0,wrong:0,tries:0,dragging:null};renderExam();}}
let tt;function showToast(msg,cls){const t=document.getElementById("toast");t.textContent=msg;t.className="toast "+cls+" show";clearTimeout(tt);tt=setTimeout(()=>t.className="toast",2600);}
function showWin(){const acc=Math.round((exam.correct/exam.tries)*100)||100;document.getElementById("winSub").textContent="Axilar: "+exam.correct+"/"+S.length+" estructuras";document.getElementById("winScore").textContent=acc+"%";const sc=document.getElementById("winScore"),gr=document.getElementById("winGrade");if(acc>=85){sc.className="win-score ga";gr.textContent="EXCELENTE - Listo para el quirofano";}else if(acc>=60){sc.className="win-score gb";gr.textContent="BIEN - Sigue practicando";}else{sc.className="win-score gc";gr.textContent="REPASA - Revisa la sonoanatomia";}document.getElementById("win").classList.add("show");}
function restartExam(){document.getElementById("win").classList.remove("show");setMode("exam");}
window.addEventListener("load",()=>{buildOverlays();renderStudy();});
</script>
