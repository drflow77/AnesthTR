<script>
const ALL_QUESTIONS = [
  // ===== HALOGENADOS =====
  {
    id:1, cat:"halogenados", diff:"easy",
    q:"¿Cuál es el CAM del Sevoflurano en adultos?",
    opts:["1.0%","2.0 - 2.05%","3.5%","0.75%"],
    ans:1,
    exp:"El CAM del Sevoflurano en adultos es aproximadamente 2.0%. Disminuye con la edad, opioides y otros adyuvantes."
  },
  {
    id:2, cat:"halogenados", diff:"easy",
    q:"¿A qué temperatura hierve el Desflurano?",
    opts:["37°C","56°C","23.5°C","100°C"],
    ans:2,
    exp:"Su bajo punto de ebullición (casi temperatura ambiente) hace que el Desflurano requiera un vaporizador especial calentado a presión. No puede usarse en vaporizadores convencionales."
  },
  {
    id:3, cat:"halogenados", diff:"easy",
    q:"¿Cuál halogenado tiene el coeficiente de partición sangre/gas más bajo entre Sevoflurano y Desflurano?",
    opts:["Sevoflurano (0.65)","Ambos igual","Desflurano (0.42)","Isoflurano (1.4)"],
    ans:2,
    exp:"A menor coeficiente sangre/gas, más rápida la inducción y el despertar. Por eso el Desflurano tiene recuperación más rápida que el Sevoflurano."
  },
  {
    id:4, cat:"halogenados", diff:"easy",
    q:"El Sevoflurano produce el Compuesto A principalmente cuando...",
    opts:["Se usa con mascarilla facial","Entra en contacto con cal sodada seca a altos flujos","Se mezcla con óxido nitroso","Se usa en pediatría"],
    ans:1,
    exp:"El Compuesto A se forma por degradación del Sevo con absorbentes de CO₂ secos. Es nefrotóxico en animales. Se recomienda flujo fresco >2 L/min con Sevo para minimizar su acumulación."
  },
  {
    id:5, cat:"halogenados", diff:"medium",
    q:"¿Cuál es el CAM del Desflurano en adultos?",
    opts:["2.0 - 2.5%","3.5 - 4.0%","6.0 - 6.6%","8.0 - 9.0%"],
    ans:2,
    exp:"El CAM del Desflurano es 6.0-6.6%, significativamente mayor que el Sevoflurano. Requiere concentraciones más altas para lograr anestesia quirúrgica."
  },
  {
    id:6, cat:"halogenados", diff:"medium",
    q:"¿Por qué el Desflurano NO se recomienda para inducción inhalatoria?",
    opts:["Es demasiado costoso","Produce irritación de vía aérea, laringoespasmo y taquicardia refleja","No tiene efecto hipnótico suficiente","Causa broncodilatación excesiva"],
    ans:1,
    exp:"A concentraciones altas es pungente e irritante. Produce tos, laringoespasmo y activación simpática. Se usa principalmente para mantenimiento, no inducción."
  },
  {
    id:7, cat:"halogenados", diff:"medium",
    q:"¿Qué efecto cardiovascular produce el Desflurano cuando se aumenta rápidamente su concentración?",
    opts:["Bradicardia e hipotensión","Taquicardia y aumento de TA por activación simpática","Bloqueo AV de primer grado","Vasodilatación periférica sin cambios en FC"],
    ans:1,
    exp:"Este efecto se debe a activación simpática refleja. Es importante en pacientes cardíacos. Se recomienda incrementar la concentración gradualmente."
  },
  {
    id:8, cat:"halogenados", diff:"medium",
    q:"¿Cuál es la ventaja del Sevoflurano para inducción inhalatoria en pediatría?",
    opts:["Tiene el CAM más bajo de todos los halogenados","No es pungente, tiene olor dulce y no irrita la vía aérea","Es el más económico","No produce depresión cardiovascular"],
    ans:1,
    exp:"Es el halogenado de elección para inducción en mascarilla en niños. Puede usarse a 8% para inducción rápida sin causar irritación ni laringoespasmo."
  },
  {
    id:9, cat:"halogenados", diff:"hard",
    q:"¿Qué es el Compuesto A y cuál es su mecanismo de nefrotoxicidad en animales?",
    opts:[
      "Un metabolito del Desflurano que daña el hígado por peroxidación lipídica",
      "Fluorometil-vinil éter formado por degradación del Sevo con absorbentes; nefrotóxico por biotransformación renal a metabolitos que alquilan proteínas tubulares",
      "Un producto de la reacción del Sevo con O₂ que produce metahemoglobina",
      "Un compuesto del Isoflurano que genera fluoruro inorgánico en exceso"

    ans:1,
    exp:"El Compuesto A (fluorometil-2,2-difluoro-1-(trifluorometil)vinil éter) se forma por degradación del Sevo con absorbentes de CO₂ secos. Su nefrotoxicidad en ratas ocurre por biotransformación renal a metabolitos reactivos que alquilan proteínas tubulares. En humanos no se ha demostrado daño clínico con flujos >1 L/min."
  },
  {

    ans:2,
    exp:"La activación simpática del Des se atenúa con: pretreatment con opioides (fentanilo, remifentanilo), dexmedetomidina, clonidina, betabloqueadores o incrementando la concentración <1 CAM/minuto."
  },

  // ===== ETOMIDATO =====
  {
    id:11, cat:"etomidato", diff:"easy",

    exp:"Dosis estándar de inducción: 0.2-0.3 mg/kg IV. Tiene gran margen de seguridad cardiovascular."
  },
  {
    id:12, cat:"etomidato", diff:"easy",
    q:"¿Cuál es la principal ventaja del Etomidato en pacientes hemodinámicamente inestables?",
    opts:[
      "Produce broncodilatación potente",
      "Mínima depresión cardiovascular — mantiene TA y FC estables",
      "Tiene efecto analgésico importante",
      "No produce apnea post-inducción"
    ],
    ans:1,
    exp:"Es el inductor de elección en pacientes en choque, cardíacos descompensados o con reserva cardiovascular limitada. No afecta significativamente la presión arterial ni el gasto cardíaco."
  },
  {
    id:13, cat:"etomidato", diff:"easy",
    q:"¿Qué efecto endocrino produce el Etomidato?",
    opts:[
      "Hipoglucemia por estimulación de insulina",
      "Hipertiroidismo transitorio",
      "Supresión adrenal — inhibe la 11-β-hidroxilasa bloqueando síntesis de cortisol",
      "Aumento de hormona de crecimiento"
    ],
    ans:2,
    exp:"Por eso se evita en infusiones prolongadas. Una sola dosis de inducción produce supresión adrenal de 4-8 horas."
  },
  {
    id:14, cat:"etomidato", diff:"easy",
    q:"¿En qué solvente está preparado el Etomidato comercial y qué problema causa?",

      "Agua destilada — no causa problemas",
      "Propilenglicol — causa dolor a la inyección y tromboflebitis",
      "Emulsión lipídica — causa hiperlipidemia",
      "Dimetilsulfóxido — causa sabor metálico"
    ],
    ans:1,
    exp:"La formulación en propilenglicol causa dolor a la inyección y tromboflebitis. La formulación en emulsión lipídica reduce estos efectos adversos pero no está disponible en todos los centros."
  },
  {
    id:15, cat:"etomidato", diff:"medium",
    q:"¿Por qué el Etomidato puede producir mioclonías y cómo se previenen?",
    opts:[
      "Por efecto directo sobre motoneurona alfa; se previene con relajantes musculares",
      "Por desinhibición de centros subcorticales; se previene con BZD u opioides previos",
      "Por irritación de la vía aérea; se previene con lidocaína nebulizada",
      "Por hiperkalemia transitoria; se previene con gluconato de calcio"
    ],
    ans:1,
    exp:"Las mioclonías del Etomidato ocurren por desinhibición de centros subcorticales. Se previenen eficazmente con premedicación de benzodiacepinas o fentanilo previo a la inducción."
  },
  {
    id:16, cat:"etomidato", diff:"medium",
    q:"¿Cuál es el mecanismo de acción del Etomidato a nivel molecular?",
    opts:[
      "Bloquea receptores NMDA como la Ketamina",
      "Potencia el receptor GABA-A aumentando la frecuencia de apertura del canal de cloro; se une al sitio β2/β3",
      "Inhibe canales de sodio voltaje-dependientes como los anestésicos locales",
      "Activa receptores opioides μ en el SNC"
    ],
    ans:1,
    exp:"El Etomidato potencia el receptor GABA-A aumentando la FRECUENCIA de apertura del canal de cloro, hiperpolarizando la membrana neuronal. Se une específicamente al sitio β2/β3 del receptor."
  },
  {
    id:17, cat:"etomidato", diff:"medium",
    q:"¿Por qué el Etomidato está contraindicado en pacientes con insuficiencia adrenal?",
    opts:[
      "Porque acelera el metabolismo de los corticosteroides exógenos",
      "Porque la supresión adrenal adicional puede precipitar una crisis adrenal aguda potencialmente fatal",
      "Porque aumenta la presión intracraneana en estos pacientes",
      "Porque produce hiperkalemia severa en insuficiencia adrenal"
    ],
    ans:1,
    exp:"En pacientes con reserva adrenal limitada (Addison, uso crónico de esteroides, sepsis grave), la inhibición adicional de la 11-β-hidroxilasa puede precipitar una crisis adrenal aguda."
  },
  {
    id:18, cat:"etomidato", diff:"medium",
    q:"¿Cuál es la vida media de redistribución del Etomidato y qué explica clínicamente?",
    opts:[
      "15-20 minutos — explica su duración de acción intermedia",
      "2-4 minutos — explica su corta duración de acción (efecto clínico 5-10 min)",
      "45-60 minutos — explica la sedación prolongada",
      "30 segundos — explica la inducción ultra rápida"
    ],
    ans:1,
    exp:"La vida media de redistribución de 2-4 minutos explica su corta duración. El Etomidato se redistribuye rápidamente del SNC a tejidos periféricos, terminando su efecto clínico en 5-10 min."
  },
  {
    id:19, cat:"etomidato", diff:"hard",
    q:"Paciente séptico requiere inducción de secuencia rápida. ¿Cuál es la evidencia en contra del Etomidato en este contexto?",
    opts:[
      "Produce broncoespasmo severo en pacientes sépticos",
      "El estudio CORTICUS y meta-análisis muestran que la supresión adrenal por dosis única se asocia a mayor mortalidad y necesidad de vasopresores en sepsis",

      "Produce coagulopatía dilucional en pacientes sépticos"

    ans:1,
    exp:"El debate sobre Etomidato en sepsis es clínicamente relevante. La alternativa actual es Ketamina 1-2 mg/kg, que ofrece estabilidad cardiovascular sin supresión adrenal. Muchos centros han reemplazado Etomidato por Ketamina en ISR para pacientes sépticos."
  },
  {
    id:20, cat:"etomidato", diff:"hard",
    q:"¿Cuál es la vía metabólica principal del Etomidato y qué polimorfismo genético modifica su efecto clínico?",

// State
let currentQuestions = [...ALL_QUESTIONS];
let currentIndex = 0;
let answered = false;
let stats = { total: 0, correct: 0, wrong: 0, streak: 0 };
let selectedCat = 'all';
let selectedDiff = 'all';

function setCategory(cat) {
  selectedCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  filterAndShuffle();
}

function setDiff(diff) {
  selectedDiff = diff;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.className = 'diff-btn';
  });
  const btn = document.getElementById('df-' + diff);
  if (diff === 'easy') btn.classList.add('active-easy');
  else if (diff === 'medium') btn.classList.add('active-medium');
  else if (diff === 'hard') btn.classList.add('active-hard');
  else btn.classList.add('diff-btn');
  filterAndShuffle();
}

function filterAndShuffle() {
  currentQuestions = ALL_QUESTIONS.filter(q => {
    const catOk = selectedCat === 'all' || q.cat === selectedCat;
    const diffOk = selectedDiff === 'all' || q.diff === selectedDiff;
    return catOk && diffOk;
  });
  shuffle(currentQuestions);
  currentIndex = 0;
  stats = { total: 0, correct: 0, wrong: 0, streak: 0 };
  updateScoreBar();
  renderQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function updateScoreBar() {
  document.getElementById('total-q').textContent = stats.total;
  document.getElementById('correct-q').textContent = stats.correct;
  document.getElementById('wrong-q').textContent = stats.wrong;
  document.getElementById('streak-q').textContent = stats.streak;
  document.getElementById('pct-q').textContent = stats.total > 0
    ? Math.round(stats.correct / stats.total * 100) + '%' : '—';
}

function renderQuestion() {
  const area = document.getElementById('game-area');

  if (currentQuestions.length === 0) {
    area.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No hay preguntas con ese filtro.<br>Prueba otra combinación.</p></div>`;
    return;
  }

  if (currentIndex >= currentQuestions.length) {
    showFinished();
    return;
  }

  answered = false;
  const q = currentQuestions[currentIndex];
  const progress = Math.round((currentIndex / currentQuestions.length) * 100);

  document.getElementById('progress-text').textContent =
    `Pregunta ${currentIndex + 1} de ${currentQuestions.length}`;
  document.getElementById('progress-fill').style.width = progress + '%';

  const diffLabel = q.diff === 'easy' ? '🟢 Fácil' : q.diff === 'medium' ? '🟡 Intermedio' : '🔴 Ultra Difícil';
  const diffClass = q.diff === 'easy' ? 'easy' : q.diff === 'medium' ? 'medium' : 'hard';
  const catLabel = {halogenados:'💨 Halogenados', etomidato:'💉 Etomidato', propofol:'🥛 Propofol', benzodiacepinas:'💊 Benzodiacepinas'}[q.cat];

  const optsHtml = q.opts.map((opt, i) =>
    `<button class="option-btn" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`
  ).join('');

  area.innerHTML = `
    <div class="question-card">
      <div class="question-meta">
        <span>${catLabel}</span>
        <span class="diff-badge ${diffClass}">${diffLabel}</span>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="explanation" id="explanation">
        <strong>✅ Respuesta correcta: ${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</strong><br><br>
        ${q.exp}
      </div>
    </div>
    <div class="nav-btns" id="nav-btns" style="display:none">
      <button class="nav-btn btn-random" onclick="skipQuestion()">⏭ Saltar</button>
      <button class="nav-btn btn-next" onclick="nextQuestion()">Siguiente →</button>
    </div>
  `;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;

  const q = currentQuestions[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  const isCorrect = idx === q.ans;

  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('correct-ans');
    else if (i === idx && !isCorrect) b.classList.add('wrong-ans');
  });

  document.getElementById('explanation').classList.add('show');
  document.getElementById('nav-btns').style.display = 'flex';

  stats.total++;
  if (isCorrect) {
    stats.correct++;
    stats.streak++;
  } else {
    stats.wrong++;
    stats.streak = 0;
  }
  updateScoreBar();
}

function nextQuestion() {
  currentIndex++;
  renderQuestion();
}

function skipQuestion() {
  currentIndex++;
  renderQuestion();
}

function showFinished() {
  const pct = Math.round(stats.correct / stats.total * 100);
  let msg = pct >= 90 ? '🏆 ¡Excelente! Nivel Adscrito.' :
            pct >= 70 ? '💪 ¡Muy bien! Sigue practicando.' :
            pct >= 50 ? '📚 Vas bien, repasa los temas.' : '🔄 A estudiar más, residente.';

  document.getElementById('game-area').innerHTML = `
    <div class="finished-card">
      <h2>¡Completado!</h2>
      <div class="final-score">${pct}%</div>
      <div class="final-msg">${stats.correct} de ${stats.total} correctas<br>${msg}</div>
      <button class="nav-btn btn-next" onclick="filterAndShuffle()" style="margin:0 auto">🔄 Jugar de nuevo</button>
    </div>
  `;
}

// Init
document.getElementById('df-all').classList.add('active-easy');
filterAndShuffle();
</script>
